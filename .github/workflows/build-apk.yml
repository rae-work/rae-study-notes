# 云端打包 APK。本机不需要装 Java / Android SDK。
#
# 只能手动触发 —— 不再是「推一次就打一个包」。
# 规则是先出网页版、Rae 确认之后才打 App（见 CLAUDE.md「发布流程」），
# 所以由 scripts/apk.sh（或 GitHub 网页上的 Run workflow）显式触发。
#
# assets/ 不在仓库里（是构建产物），这里从 content/ + audio/ 现生成，
# 和本机 scripts/apk.sh 跑的是同一个 scripts/prepare-assets.js。
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 装依赖
        run: npm ci

      - name: 校验 + 构建网页版
        run: |
          npm run validate
          npm run build

      - name: 生成安卓 assets
        run: npm run prepare-assets

      # 签名密钥不在仓库里（公开仓库不能放密钥），从 Secrets 还原
      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "❌ 缺 Secret：KEYSTORE_BASE64"
            echo "   本机跑一次：base64 -i android-app/release.keystore | gh secret set KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-app/release.keystore
          echo "已还原 release.keystore（$(wc -c < android-app/release.keystore) 字节）"

      - name: 确认打包用的资源都在
        run: |
          test -f android-app/app/src/main/assets/index.html || { echo "❌ 缺 assets/index.html"; exit 1; }
          test -f android-app/release.keystore || { echo "❌ 缺 release.keystore"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android-app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: 擦掉还原出来的密钥
        if: always()
        run: rm -f android-app/release.keystore

      - name: 确认用的是 release.keystore 那把签名
        working-directory: android-app
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          SDK=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK/apksigner" verify --print-certs "$APK"
          "$SDK/apksigner" verify --print-certs "$APK" \
            | tr -d ' :' | grep -qi '84dc35e826bf0c59a6986bcb48c96ecd7672a4cd07e69880055b5d4bc79e1198' \
            && echo "✅ 签名正确（release.keystore）" \
            || { echo "❌ 签名不对 —— 装不上旧版本的覆盖升级"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
