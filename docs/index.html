<title>Rae 的学习笔记</title>
<style>
  /* ============================================================
     「纸间」视觉体系 · 2026-08-25 改版
     兼容基线：iOS 15 Safari / Android Chrome 100+
     可以用 flex gap、CSS 变量、grid。

     所有颜色一律走变量，三处定义保持同步：
       :root                          → 浅色（默认）
       @media (prefers-color-scheme:dark):root:not([data-theme=light])
       :root[data-theme=dark]         → 手动切到深色
     新增颜色必须同时加进这三处，否则深色模式必漏。
     ============================================================ */
  :root{
    /* ── 中性色（浅色）── 五套配色共用这一组，只有强调色会变 ── */
    --paper:#faf8f4;        /* 页面底色：微灰暖白，不是纯白 */
    --paper-0:rgba(250,248,244,0);   /* 上面这个色的全透明版（表格渐变遮罩用） */
    --surface:#f5f2ec;      /* 略深一层：页眉、侧栏、输入框 */
    --ink:#322f2b;          /* 正文墨色 */
    --ink-soft:#8c867c;     /* 辅助文字 */
    --ink-faint:#a8a296;    /* 更弱：页码、占位 */
    --line:#e7e2d9;         /* 细分隔线 */
    --line-soft:#efebe3;    /* 更淡的线：表格内框 */
    --warn-wash:#f7efe2;    /* 答错底色 */

    /* ── 圆角：全站只用这三档，卡片和表格必须一致 ── */
    --r-sm:10px;             /* 小块：标签、输入框、按钮 */
    --r-md:14px;            /* 卡片、提示块、表格 */
    --r-lg:18px;            /* 弹层、抽屉里的大块 */

    /* ── 动效：统一时长和缓动，整体要「柔」而不是「弹」 ── */
    --ease:cubic-bezier(.4,0,.2,1);
    --t-fast:.18s;          /* hover、点亮 */
    --t-mid:.26s;           /* 卡片、按钮状态 */
    --t-slow:.34s;          /* 抽屉、弹层、翻页 */

    --rs:17px; --maxw:760px;

    /* 衬线只给「内容」：课文、对话、释义、标题。
       安卓通常没有中文衬线，会退到系统黑体 —— 已知限制，可接受。 */
    --serif: Georgia, "Times New Roman", "Songti SC", "Source Han Serif SC",
             "Noto Serif CJK SC", "Hiragino Mincho ProN", "Yu Mincho",
             "Noto Serif CJK JP", serif;
    /* 无衬线给「界面」：按钮、菜单、标签、输入框、目录、页码。
       小字号下衬线发糊，界面元素一律走这个。 */
    --ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans",
          "Helvetica Neue", "Microsoft YaHei", "Yu Gothic", "Noto Sans CJK SC",
          "Noto Sans CJK JP", Helvetica, Arial, sans-serif;
  }

  /* ══════════════════════════════════════════════════════════
     强调色 · 五套，全部低饱和
     切换靠 <html data-accent="…">，不写就是 rose。
     每套五个变量：实心色 / 文字色 / 淡底 / 描边 / 压在实心上的字色
     ══════════════════════════════════════════════════════════ */
  :root,
  :root[data-accent="rose"]{
    --accent:#ad7683; --accent-ink:#8f5f6c; --accent-wash:#f2eaeb;
    --accent-line:#e2d3d6; --on-accent:#ffffff;
  }
  :root[data-accent="blue"]{
    --accent:#6e8399; --accent-ink:#566a80; --accent-wash:#e9edf1;
    --accent-line:#d2dae2; --on-accent:#ffffff;
  }
  :root[data-accent="ochre"]{
    --accent:#a8874e; --accent-ink:#8a6e3c; --accent-wash:#f3eee3;
    --accent-line:#e1d7c2; --on-accent:#ffffff;
  }
  :root[data-accent="sage"]{
    --accent:#6f8a73; --accent-ink:#58705c; --accent-wash:#e9efe9;
    --accent-line:#d4dfd5; --on-accent:#ffffff;
  }
  :root[data-accent="mauve"]{
    --accent:#82769b; --accent-ink:#6a5e82; --accent-wash:#edeaf2;
    --accent-line:#dbd5e4; --on-accent:#ffffff;
  }

  /* ── 深色模式的中性色 ── */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#211f1c; --paper-0:rgba(33,31,28,0); --surface:#282521;
      --ink:#eae6df; --ink-soft:#9c968b; --ink-faint:#7d776d;
      --line:#3a362f; --line-soft:#332f29; --warn-wash:#38312a;
    }
    /* 深色下的强调色：提亮、降饱和，避免在暗底上刺眼 */
    :root:not([data-theme="light"]),
    :root:not([data-theme="light"])[data-accent="rose"]{
      --accent:#c9a0a9; --accent-ink:#d3aab2; --accent-wash:#372e30;
      --accent-line:#4a3e41; --on-accent:#241c1e;
    }
    :root:not([data-theme="light"])[data-accent="blue"]{
      --accent:#9db2c6; --accent-ink:#a8bcce; --accent-wash:#2a3138;
      --accent-line:#3c464f; --on-accent:#1a2026;
    }
    :root:not([data-theme="light"])[data-accent="ochre"]{
      --accent:#c9ac77; --accent-ink:#d2b884; --accent-wash:#35301f;
      --accent-line:#48412c; --on-accent:#221e14;
    }
    :root:not([data-theme="light"])[data-accent="sage"]{
      --accent:#9db8a1; --accent-ink:#a8c0ac; --accent-wash:#2a322b;
      --accent-line:#3d473f; --on-accent:#1a211b;
    }
    :root:not([data-theme="light"])[data-accent="mauve"]{
      --accent:#b0a4c6; --accent-ink:#baafd0; --accent-wash:#322d3b;
      --accent-line:#453e52; --on-accent:#201c27;
    }
  }

  /* ── 手动切到深色（媒体查询让位）── */
  :root[data-theme="dark"]{
    --paper:#211f1c; --paper-0:rgba(33,31,28,0); --surface:#282521;
    --ink:#eae6df; --ink-soft:#9c968b; --ink-faint:#7d776d;
    --line:#3a362f; --line-soft:#332f29; --warn-wash:#38312a;
  }
  :root[data-theme="dark"],
  :root[data-theme="dark"][data-accent="rose"]{
    --accent:#c9a0a9; --accent-ink:#d3aab2; --accent-wash:#372e30;
    --accent-line:#4a3e41; --on-accent:#241c1e;
  }
  :root[data-theme="dark"][data-accent="blue"]{
    --accent:#9db2c6; --accent-ink:#a8bcce; --accent-wash:#2a3138;
    --accent-line:#3c464f; --on-accent:#1a2026;
  }
  :root[data-theme="dark"][data-accent="ochre"]{
    --accent:#c9ac77; --accent-ink:#d2b884; --accent-wash:#35301f;
    --accent-line:#48412c; --on-accent:#221e14;
  }
  :root[data-theme="dark"][data-accent="sage"]{
    --accent:#9db8a1; --accent-ink:#a8c0ac; --accent-wash:#2a322b;
    --accent-line:#3d473f; --on-accent:#1a211b;
  }
  :root[data-theme="dark"][data-accent="mauve"]{
    --accent:#b0a4c6; --accent-ink:#baafd0; --accent-wash:#322d3b;
    --accent-line:#453e52; --on-accent:#201c27;
  }

  @media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  html,body{margin:0;height:100%}
  body{font-family:var(--serif);color:var(--ink);background:var(--paper);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overflow:hidden;
    -webkit-tap-highlight-color:rgba(180,86,106,.14)}
  button,input,select{font-family:var(--ui);-webkit-appearance:none;appearance:none;border-radius:0}

  /* ===== 页眉 =====
     只留三个按钮：目录、遮盖答案、设置。
     词汇表 / 复习 / 实战 走目录抽屉（那三页本来就在目录里）；
     语言 / 主题 / 语速 / 字号 收进设置弹层 —— 都是设一次就不动的东西，
     不该常驻占地方。 */
  header{position:relative;flex:0 0 auto;background:var(--paper);color:var(--ink);
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:6px;padding:8px 12px;z-index:30}
  header .spacer{flex:1 1 auto;min-width:0}
  /* 品牌副标题：engine.js 要往里写字（#brandZh 不能删），但页眉不再显示它 */
  .brand-zh{display:none}
  .icon-btn{min-width:40px;height:40px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:7px;
    background:transparent;border:1px solid transparent;border-radius:var(--r-sm);
    color:var(--ink-soft);cursor:pointer;padding:0 11px;
    transition:color var(--t-fast) var(--ease),background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease)}
  .icon-btn svg{width:21px;height:21px;flex:0 0 auto}
  .icon-btn .gbl{font-family:var(--ui);font-size:12.5px;font-weight:600;white-space:nowrap}
  .icon-btn.on{color:var(--accent-ink);background:var(--accent-wash);border-color:var(--accent-line)}

  /* 设置弹层：默认收起，点 ⚙ 展开，点别处 / Esc 收起。
     不用 display:none —— 那样没法做淡入淡出，改用 visibility + opacity。 */
  .ctrls{display:flex;position:absolute;top:calc(100% + 6px);right:12px;z-index:60;
    flex-direction:column;gap:14px;min-width:246px;
    background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:16px 17px;box-shadow:0 18px 40px -22px rgba(0,0,0,.4);
    transform-origin:top right;transform:scale(.97) translateY(-6px);
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity var(--t-mid) var(--ease),
               transform var(--t-mid) var(--ease),
               visibility 0s linear var(--t-mid)}
  header.open .ctrls{transform:none;opacity:1;visibility:visible;pointer-events:auto;
    transition-delay:0s,0s,0s}
  .grp{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:36px}
  .grp .lab{font-family:var(--ui);font-size:11px;color:var(--ink-soft);letter-spacing:.1em;flex:0 0 auto}
  select.voice{font-family:var(--ui);font-size:13px;color:var(--ink);background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 22px 7px 10px;max-width:190px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
  .seg button{font-size:12px;color:var(--ink-soft);background:transparent;
    border:0;padding:8px 12px;min-height:36px;cursor:pointer;font-weight:600;
    transition:color var(--t-fast) var(--ease),background var(--t-fast) var(--ease)}
  .seg button + button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--accent);color:var(--on-accent)}
  .stage{flex:1 1 auto;display:flex;min-height:0}

  /* ===== 目录：所有屏幕尺寸都是抽屉 =====
     以前宽屏是常驻侧栏，于是侧栏和正文各有一条滚动条，页面上同时两条，很怪。
     改成抽屉之后全局只有正文一个滚动区。 */
  nav.toc{position:fixed;top:0;bottom:0;left:0;width:272px;z-index:50;
    background:var(--surface);color:var(--ink);
    border-right:1px solid var(--line);overflow:auto;-webkit-overflow-scrolling:touch;padding:14px 0 28px;
    transform:translateX(-100%);transition:transform var(--t-slow) var(--ease)}
  nav.toc.open{transform:none}
  .toc h3{font-family:var(--ui);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);
    margin:14px 18px 8px;font-weight:700}
  .toc h3:first-child{margin-top:4px}
  .toc h3.ref{border-top:1px solid var(--line);padding-top:14px;color:var(--accent-ink)}
  .toc a{display:flex;align-items:baseline;gap:9px;text-decoration:none;color:var(--ink-soft);
    padding:11px 18px;font-size:13.5px;line-height:1.4;cursor:pointer;border-left:3px solid transparent;
    font-family:var(--ui);transition:color var(--t-fast) var(--ease),background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease)}
  .toc a .pg{font-family:var(--ui);font-variant-numeric:tabular-nums;font-size:11px;color:var(--ink-faint);width:34px;flex:0 0 auto}
  .toc a.active{color:var(--accent-ink);border-left-color:var(--accent);background:var(--accent-wash);font-weight:600}
  .toc a.active .pg{color:var(--accent-ink)}

  /* ===== 阅读区：像书页，不是卡片 ===== */
  .reader{flex:1 1 auto;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 22px 40px}
  .sheet{max-width:var(--maxw);margin:0 auto;background:transparent;color:var(--ink);
    padding:26px 0 34px;font-size:var(--rs);line-height:1.62}

  /* 页头：标题与页码同一行 */
  .phead{margin-bottom:24px}
  .eyebrow{font-family:var(--ui);font-size:.7em;letter-spacing:.26em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
  .ptitle-row{display:flex;align-items:baseline;gap:14px;margin:.3em 0 .12em}
  .ptitle{font-size:2em;line-height:1.2;font-weight:700;letter-spacing:-.01em;margin:0;flex:1 1 auto;min-width:0}
  .ptitle-sub{color:var(--ink-soft);font-size:.9em;line-height:1.55;margin-top:7px}
  .pcount{font-family:var(--ui);flex:0 0 auto;font-size:12px;color:var(--ink-soft);
    font-variant-numeric:tabular-nums;letter-spacing:.12em}
  .psub{color:var(--ink-soft);font-size:.9em}
  .lead{color:var(--ink-soft);font-size:.95em;margin:0 0 22px;max-width:62ch;line-height:1.7}

  .rule{height:1px;background:var(--line);border:0;margin:26px 0}
  .rule.short{width:56px;background:var(--accent);height:2px;margin:30px 0 22px}

  .mini{display:flex;align-items:center;justify-content:center;gap:12px;text-align:center;
    margin:30px 0 14px;color:var(--accent-ink);font-weight:700;font-size:.92em}
  .mini::before,.mini::after{content:"";height:1px;background:var(--line);flex:1 1 auto;max-width:90px}

  .sec{display:flex;align-items:center;gap:12px;margin:30px 0 12px}
  .sec .num{font-family:var(--ui);flex:0 0 auto;width:28px;height:28px;border-radius:999px;
    background:var(--accent-wash);color:var(--accent-ink);border:1px solid var(--accent-line);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
  .sec .word{font-size:1.28em;font-weight:700;letter-spacing:-.01em}
  .sec .en{color:var(--ink-soft);font-weight:500;font-size:.9em}
  .sec .en b{color:var(--accent-ink);font-weight:600}

  .pattern{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;background:var(--accent-wash);
    border:0;border-radius:var(--r-sm);padding:11px 14px;margin:4px 0 12px}
  .pattern .plab{font-family:var(--ui);font-size:.66em;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
  .pattern code{font-family:var(--serif);font-weight:600;font-size:1em}
  .pattern code b{color:var(--accent-ink)}
  .pattern .pnote{color:var(--ink-soft);font-size:.82em}

  /* 可点读词元 */
  .say{cursor:pointer;-webkit-user-select:none;user-select:none;
    border-radius:6px;padding:.1em .2em;margin:-.1em -.2em;
    transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease);white-space:nowrap}
  .say.kw{color:var(--accent-ink);font-weight:600}
  .say.speaking{background:var(--accent-wash);color:var(--accent-ink);box-shadow:0 0 0 1px var(--accent-line) inset}
  .say.speaking.kw{color:var(--accent-ink)}
  .card-tap{cursor:pointer;-webkit-user-select:none;user-select:none;
    transition:border-color var(--t-mid) var(--ease),background var(--t-mid) var(--ease),box-shadow var(--t-mid) var(--ease)}
  .card-tap.speaking{background:var(--accent-wash);border-color:var(--accent-line)}
  /* 卡片本身就是一个可点读的整体：卡片里那个和卡片同义的词（词汇表的词头、
     词卡的词）不再单独画高亮，否则会出现「词的高亮」叠在「卡片的高亮」上，
     看起来像两层。点它 = 点整张卡，由 engine.js 的点击委托负责改派。 */
  .say.cardword{border-radius:0;padding:0;margin:0;white-space:normal;
    background:none;box-shadow:none}
  .say.cardword.speaking{background:none;box-shadow:none;color:inherit}

  /* 对话行 */
  .row{display:flex;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .play{flex:0 0 auto;width:34px;height:34px;border-radius:999px;border:1px solid var(--line);
    background:transparent;color:var(--accent);cursor:pointer;
    display:flex;align-items:center;justify-content:center;align-self:flex-start;padding:0;
    transition:color var(--t-mid) var(--ease),background var(--t-mid) var(--ease),border-color var(--t-mid) var(--ease)}
  .play svg{width:17px;height:17px;display:block}
  .play-spacer{flex:0 0 auto;width:34px}
  .who{font-family:var(--ui);flex:0 0 auto;min-width:54px;font-weight:600;color:var(--accent-ink);font-size:.8em;
    letter-spacing:.08em;text-transform:uppercase}
  .line{flex:1 1 auto;min-width:0}
  .line .gloss{color:var(--ink-soft);font-size:.84em;display:block;margin-top:3px;line-height:1.6}
  .idtext{font-weight:500}

  /* 词卡网格 */
  .vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:6px 0}
  .vk{border:1px solid var(--line);border-radius:var(--r-md);padding:11px 13px;background:transparent;display:flex;flex-direction:column;gap:3px}
  .vk .en{font-family:var(--ui);font-size:.7em;letter-spacing:.04em;color:var(--ink-faint);text-transform:lowercase}
  .vk .w{font-weight:600;font-size:1.02em}
  .vk .zh{font-size:.8em;color:var(--ink-soft);line-height:1.55}

  .alpha{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;margin:8px 0}
  .at{border:1px solid var(--line);border-radius:var(--r-md);padding:10px 4px;text-align:center;background:transparent}
  .at .L{font-size:1.4em;font-weight:700;line-height:1}
  .at .p{font-size:.72em;color:var(--accent-ink);margin-top:3px;font-style:italic}

  .pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin:8px 0}
  .pic{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 6px;text-align:center;background:transparent}
  .pic .em{font-size:1.9em;line-height:1}
  .pic .w{font-weight:600;margin-top:6px}
  .pic .zh{font-size:.76em;color:var(--ink-soft)}

  .numgrp{margin:14px 0}
  .numgrp .glab{font-family:var(--ui);font-size:.72em;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);font-weight:700;margin-bottom:6px}
  .nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:6px}
  .nb{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 8px;border:1px solid var(--line);
    border-radius:var(--r-md);padding:8px 11px;background:transparent;min-width:0}
  .nb .n{font-family:var(--ui);font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent-ink);font-size:.9em;flex:0 0 auto}
  .nb .v{font-weight:500;border-radius:6px;min-width:0;word-wrap:break-word;word-break:break-word}

  .phone{display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);border-radius:var(--r-md);padding:11px 13px;background:transparent;margin:6px 0}
  .phone .d{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1em;letter-spacing:.04em}
  .phone .s{font-size:.86em;color:var(--ink-soft)}

  .ladder{border-left:2px solid var(--accent);padding-left:16px;margin:8px 0;display:flex;flex-direction:column;gap:9px}
  .ladder .step{display:flex;align-items:baseline;gap:10px}
  .ladder .lvl{font-family:var(--ui);font-size:.72em;color:var(--ink-soft);min-width:64px}
  .currency{display:flex;align-items:center;gap:12px;background:var(--accent-wash);border:0;border-radius:var(--r-md);padding:13px 15px;margin-top:8px}
  .currency .rp{font-family:var(--ui);background:var(--accent);color:var(--on-accent);font-weight:700;border-radius:var(--r-sm);padding:6px 12px;font-variant-numeric:tabular-nums}

  /* 提示块：粉底或绿底，去掉左侧粗边 */
  .note{background:var(--accent-wash);border:0;border-radius:var(--r-md);padding:15px 17px;margin:20px 0}
  /* green 只是「提示/目标」这一类，用中性底色区分，不引入第三种颜色 */
  .note.green{background:var(--surface)}
  .note .tag{font-family:var(--ui);display:inline-block;font-size:.68em;letter-spacing:.14em;text-transform:uppercase;
    font-weight:700;color:var(--accent-ink);margin-bottom:8px}
  .note.green .tag{color:var(--ink-soft)}
  .note p{margin:.4em 0;line-height:1.7}
  .note .qa{margin:.4em 0;display:flex;gap:10px}
  .note .qa .who{min-width:62px}

  .prompt{background:transparent;border:1px solid var(--accent-line);border-radius:var(--r-md);padding:15px 17px;margin:20px 0;color:var(--ink)}
  .prompt .tag{font-family:var(--ui);font-size:.68em;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--accent-ink)}

  .exer{margin:14px 0}
  .exer .ehead{font-weight:700;font-size:.95em;margin-bottom:8px}
  .exer ol{margin:0;padding-left:1.5em}
  .exer li{padding:10px 0;border-bottom:1px solid var(--line)}
  .exer li:last-child{border-bottom:0}
  .qa-line{display:flex;align-items:baseline;gap:9px}
  .qa-line + .qa-line{margin-top:4px}
  .qa-line .plain{color:var(--ink-soft);font-size:.95em}
  .ans{border-radius:6px;transition:filter var(--t-mid) var(--ease)}
  .ans.masked{filter:blur(6px);cursor:pointer}
  .ans.masked::selection{background:transparent}
  .fb-chip{color:var(--accent-ink);font-weight:600;border-bottom:2px solid var(--accent-line);padding:0 .18em}

  /* 发音卡 */
  .syl{display:grid;grid-template-columns:repeat(auto-fill,minmax(214px,1fr));gap:10px;margin:8px 0}
  .syl-card{border:1px solid var(--line);border-radius:var(--r-md);background:transparent;padding:13px 14px;display:flex;flex-direction:column;gap:8px}
  .sylw{font-weight:700;font-size:1.16em;display:flex;flex-wrap:wrap;align-items:baseline}
  .sdot{color:var(--accent);font-weight:400;margin:0 2px}
  .sylg{font-size:.8em;color:var(--ink-soft)}
  .prbar{display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line);padding-top:9px}
  .pr-btn{font-family:var(--ui);font-size:12px;font-weight:600;color:var(--accent-ink);background:transparent;
    border:1px solid var(--line);border-radius:999px;padding:9px 14px;min-height:36px;cursor:pointer;
    transition:color var(--t-fast) var(--ease),background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease)}
  .pr-btn.rec{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}

  /* ===== 词汇表 ===== */
  .gsearch{width:100%;font-family:var(--ui);font-size:16px;color:var(--ink);background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px;min-height:46px;margin:0 0 12px}
  .gfilter{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
  .chip{font-family:var(--ui);font-size:12.5px;font-weight:600;color:var(--ink-soft);background:transparent;
    border:1px solid var(--line);border-radius:999px;padding:9px 16px;min-height:36px;cursor:pointer;
    transition:color var(--t-fast) var(--ease),background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease)}
  .chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:12px}
  .gentry{border:1px solid var(--line);border-radius:var(--r-md);padding:13px 14px;background:transparent;display:flex;flex-direction:column;gap:6px}
  .gtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .gword{font-weight:600;font-size:1.1em}
  .gbadge{font-family:var(--ui);font-size:.64em;font-weight:700;border-radius:999px;padding:3px 9px;
    background:var(--accent-wash);color:var(--accent-ink);flex:0 0 auto}
  .ggloss{font-size:.86em;color:var(--ink-soft);line-height:1.6}
  .ggloss .en{font-style:italic}
  .gex{display:flex;align-items:baseline;gap:8px;border-top:1px solid var(--line);padding-top:9px}
  .gex .gloss{color:var(--ink-soft);font-size:.8em;display:block;margin-top:2px}
  .gempty{font-family:var(--ui);display:none;color:var(--ink-soft);text-align:center;padding:26px 0;font-size:.92em}
  .gmore{font-family:var(--ui);display:none;text-align:center;color:var(--ink-soft);font-size:.86em;padding:14px 0}
  .glist .ans.masked{filter:none;color:transparent;background:var(--accent-wash)}
  .glist .ans.masked *{color:transparent}

  /* ===== 复习 / 实战 ===== */
  .qz-secttl{font-family:var(--ui);font-size:.72em;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);font-weight:700;margin:20px 0 8px}
  .qz-chips{display:flex;flex-wrap:wrap;gap:8px}
  .qz-start{display:block;width:100%;max-width:360px;margin:26px auto 6px;padding:16px 18px;min-height:52px;
    background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;border:0;border-radius:var(--r-md);cursor:pointer;
    font-family:var(--ui);transition:background var(--t-mid) var(--ease),opacity var(--t-mid) var(--ease)}
  .qz-start:disabled{opacity:.4;cursor:default}
  .qz-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .qz-count{font-family:var(--ui);font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;letter-spacing:.12em}
  .qz-toast{color:var(--accent-ink);font-weight:700}
  .qz-bar{height:2px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 26px}
  .qz-bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width var(--t-slow) var(--ease)}
  .qz-type{font-family:var(--ui);font-size:.7em;letter-spacing:.2em;color:var(--accent-ink);font-weight:700;text-transform:uppercase}
  .qz-prompt{font-size:1.6em;font-weight:700;margin:.35em 0 .7em;line-height:1.35}
  .qz-prompt .sub{display:block;font-size:.5em;color:var(--ink-soft);font-weight:500;margin-top:9px;line-height:1.6}
  .qz-audio{display:inline-flex;align-items:center;gap:9px;font-family:var(--ui);font-size:15px;font-weight:600;color:var(--accent-ink);
    background:transparent;border:1px solid var(--line);border-radius:999px;padding:12px 20px;min-height:46px;cursor:pointer;margin:2px 0 6px;
    transition:background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
  .qz-audio svg{width:18px;height:18px;flex:0 0 auto}
  .qz-opts{display:grid;grid-template-columns:1fr;gap:11px;margin-top:6px}
  @media (min-width:620px){ .qz-opts{grid-template-columns:1fr 1fr} }
  .qz-opt{font-family:var(--serif);font-size:16px;font-weight:500;text-align:left;padding:15px 16px;border:1px solid var(--line);
    border-radius:var(--r-md);background:transparent;color:var(--ink);cursor:pointer;min-height:56px;line-height:1.5;
    transition:border-color var(--t-mid) var(--ease),background var(--t-mid) var(--ease),color var(--t-mid) var(--ease)}
  .qz-opt.good{border-color:var(--accent);background:var(--accent-wash);color:var(--ink)}
  .qz-opt.bad{border-color:var(--line);background:var(--warn-wash)}
  .qz-opt.dim{opacity:.45}
  .qz-fb{border:0;background:var(--accent-wash);border-radius:var(--r-md);padding:16px 17px;margin-top:18px}
  .qz-fb .fw{font-size:1.4em;font-weight:700}
  .qz-fb .fg{color:var(--ink-soft);margin-top:4px;line-height:1.7}
  .qz-fb .fex{border-top:1px solid var(--accent-line);margin-top:11px;padding-top:11px}
  .qz-fb .fnote{color:var(--accent-ink);font-weight:600;font-size:.9em;margin-top:10px;line-height:1.7}
  .qz-next{margin-top:16px;padding:14px 28px;min-height:48px;background:var(--accent);color:var(--on-accent);font-weight:700;
    border:0;border-radius:var(--r-sm);font-size:15px;cursor:pointer;font-family:var(--ui);transition:background var(--t-mid) var(--ease),color var(--t-mid) var(--ease)}
  .qz-done{text-align:center;padding:8px 0}
  .qz-pct{font-family:var(--ui);font-size:3em;font-weight:700;color:var(--accent-ink);line-height:1.15}
  .qz-line{color:var(--ink-soft);margin:6px 0 4px}
  .qz-wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:16px 0;text-align:left}
  .qz-acts{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .qz-acts .qz-next{margin-top:0}
  .qz-acts .alt{background:transparent;color:var(--accent-ink);border:1px solid var(--accent-line)}

  /* 实战问答 */
  .dr-big{font-size:2.4em;font-weight:700;letter-spacing:.01em;line-height:1.2;margin:.2em 0 .1em}
  .dr-cue{font-family:var(--ui);display:inline-block;background:var(--accent-wash);color:var(--accent-ink);font-weight:600;
    font-size:.92em;border-radius:var(--r-sm);padding:9px 14px;margin:6px 0 4px}
  .dr-q{font-size:1.4em;font-weight:700;line-height:1.4;margin:.3em 0 .1em}

  /* ===== 底部翻页 ===== */
  .page-nav{display:flex;align-items:center;justify-content:space-between;gap:14px;
    max-width:var(--maxw);margin:26px auto 4px;border-top:1px solid var(--line);padding-top:16px}
  .nav-btn{display:inline-flex;align-items:center;gap:7px;font-family:var(--ui);font-weight:600;font-size:14px;
    color:var(--accent-ink);background:transparent;border:0;border-radius:var(--r-sm);padding:11px 4px;min-height:44px;cursor:pointer;
    transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
  .nav-btn svg{width:16px;height:16px;flex:0 0 auto}
  .nav-btn:disabled{color:var(--ink-faint);cursor:default}
  /* 页码已经移到标题行（.pcount），底部这个只保留元素给 engine.js 写，不显示 */
  .counter{display:none}

  .banner{display:none;background:var(--accent-wash);color:var(--accent-ink);font-size:12.5px;padding:9px 16px;
    border-bottom:1px solid var(--accent-line);align-items:center;font-family:var(--ui)}
  .banner.show{display:flex}
  .banner b{color:var(--accent-ink)}

  .scrim{display:block;position:fixed;top:0;right:0;bottom:0;left:0;
    background:rgba(0,0,0,.42);z-index:45;opacity:0;pointer-events:none;transition:opacity var(--t-slow) var(--ease)}
  .scrim.show{opacity:1;pointer-events:auto}

  @media (hover:hover){
    .say:hover{background:var(--accent-wash)}
    .say.cardword:hover{background:none}
    .card-tap:hover{border-color:var(--accent-line);background:var(--accent-wash)}
    .seg button:not(.on):hover{color:var(--ink)}
    .icon-btn:hover{color:var(--ink);background:var(--surface)}
    .icon-btn.on:hover{color:var(--accent-ink);background:var(--accent-wash)}
    .toc a:hover{color:var(--ink);background:var(--line-soft)}
    .play:hover{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
    .nav-btn:hover:not(:disabled){background:var(--accent-wash)}
    .chip:hover{border-color:var(--accent-line);color:var(--ink)}
    .pr-btn:hover{border-color:var(--accent-line);color:var(--ink)}
    .qz-opt:hover{border-color:var(--accent-line)}
    .qz-audio:hover{border-color:var(--accent-line);background:var(--accent-wash)}
    .ans.masked:hover{filter:blur(3px)}
    .glist .ans.masked:hover{filter:none}
  }

  header.open #setBtn{color:var(--accent-ink);background:var(--accent-wash);border-color:var(--accent-line)}

  @media (max-width:860px){
    select.voice{font-size:16px;max-width:160px}
    .icon-btn{padding:0;min-width:40px}
    .icon-btn .gbl{display:none}
    .reader{padding:0 16px 36px}
    .sheet{padding:20px 0 30px}
    .ptitle{font-size:1.7em}
  }

  /* ===== 教材听力音轨 ===== */
  .listen{border:1px solid var(--line);border-radius:var(--r-md);background:transparent;
    padding:15px 16px 13px;margin:16px 0}
  .lis-top{display:flex;align-items:center;gap:13px}
  .lis-play{display:inline-flex;align-items:center;gap:9px;font-family:var(--ui);font-size:14px;font-weight:600;
    color:var(--on-accent);background:var(--accent);border:0;border-radius:999px;padding:12px 20px;min-height:44px;cursor:pointer;white-space:nowrap;
    transition:background var(--t-mid) var(--ease),opacity var(--t-mid) var(--ease)}
  .lis-play svg{width:16px;height:16px;flex:0 0 auto}
  .lis-meta{font-family:var(--ui);font-size:.84em;color:var(--ink-soft)}
  .lis-bar{height:3px;border-radius:2px;background:var(--line);margin:14px 0 0;overflow:hidden}
  .lis-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .18s linear}
  .lis-note{margin:11px 0 0;font-size:.88em;color:var(--ink-soft);line-height:1.7}
  .lis-src{font-family:var(--ui);margin-top:9px;font-size:.7em;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}

  /* ===== 语法表格 ===== */
  .tblwrap{margin:18px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;
    background:linear-gradient(to right, var(--paper) 30%, var(--paper-0)),
               linear-gradient(to left, var(--paper) 30%, var(--paper-0)) 100% 0;
    background-size:28px 100%;background-repeat:no-repeat;background-attachment:local, local}
  /* 表格和卡片用同一档圆角。border-collapse 必须是 separate，
     collapse 状态下 overflow:hidden 裁不出圆角。 */
  table.tbl{border-collapse:separate;border-spacing:0;width:100%;min-width:460px;font-size:.92em;
    border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
  table.tbl th{background:var(--accent-wash);color:var(--accent-ink);font-weight:700;font-family:var(--ui);font-size:.9em;
    text-align:left;padding:11px 12px;border:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line-soft);white-space:nowrap}
  table.tbl td{padding:11px 12px;border:0;border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft);
    vertical-align:top;line-height:1.9}
  table.tbl th:last-child,table.tbl td:last-child{border-right:0}
  table.tbl tr:last-child td{border-bottom:0}
  table.tbl td:first-child{color:var(--ink-soft);font-size:.9em;line-height:1.6;min-width:8.5em}
  table.tbl td .say{margin-right:2px}
  .rbadge{font-family:var(--ui);display:inline-block;font-size:.6em;font-weight:600;letter-spacing:.04em;
    padding:2px 7px;border-radius:999px;margin:0 0 0 5px;vertical-align:middle;white-space:nowrap}
  .rbadge.f{background:var(--accent-wash);color:var(--accent-ink)}
  .rbadge.c{background:var(--warn-wash);color:var(--ink-soft)}
  .tbl-note{margin:10px 0 0;font-size:.86em;color:var(--ink-soft);line-height:1.7}

  /* ===== 配色选择器（设置弹层里的一排色点）===== */
  .swatches{display:flex;gap:8px}
  .sw{width:26px;height:26px;flex:0 0 auto;border-radius:999px;cursor:pointer;padding:0;
    border:2px solid transparent;background-clip:padding-box;
    transition:transform var(--t-mid) var(--ease),border-color var(--t-mid) var(--ease)}
  .sw i{display:block;width:100%;height:100%;border-radius:999px;background:var(--sw)}
  .sw.on{border-color:var(--ink-soft);transform:scale(1.08)}
  .sw-rose{--sw:#ad7683}  .sw-blue{--sw:#6e8399}  .sw-ochre{--sw:#a8874e}
  .sw-sage{--sw:#6f8a73}  .sw-mauve{--sw:#82769b}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .sw-rose{--sw:#c9a0a9}
    :root:not([data-theme="light"]) .sw-blue{--sw:#9db2c6}
    :root:not([data-theme="light"]) .sw-ochre{--sw:#c9ac77}
    :root:not([data-theme="light"]) .sw-sage{--sw:#9db8a1}
    :root:not([data-theme="light"]) .sw-mauve{--sw:#b0a4c6}
  }
  :root[data-theme="dark"] .sw-rose{--sw:#c9a0a9}
  :root[data-theme="dark"] .sw-blue{--sw:#9db2c6}
  :root[data-theme="dark"] .sw-ochre{--sw:#c9ac77}
  :root[data-theme="dark"] .sw-sage{--sw:#9db8a1}
  :root[data-theme="dark"] .sw-mauve{--sw:#b0a4c6}
  @media (hover:hover){ .sw:hover{transform:scale(1.12)} }

  /* ===== 翻页淡入 =====
     #sheet 这个元素本身不换，只换 innerHTML，所以动画不会自动重播。
     engine.js 的 render() 会摘掉再加回 .fade 触发重排来重新播放。 */
  @keyframes pageIn{ from{opacity:0;transform:translateY(7px)} to{opacity:1;transform:none} }
  .sheet.fade{animation:pageIn var(--t-slow) var(--ease)}

  /* 日语界面：把明朝体提到宋体之前 */
  html[lang="ja"] body{
    font-family: Georgia, "Times New Roman", "Hiragino Mincho ProN", "Yu Mincho",
      "Noto Serif CJK JP", "Songti SC", serif;
  }
</style>
</head>

· Titian Bahasa Pemula 1 · Bab 1 Perkenalan（课本第 1–10 页）","reg_default":"formal","name":{"zh":"自我介绍","ja":"自己紹介","en":"Introductions"},"pages":[[{"k":"phead","title":"Perkenalan","sub":{"zh":"自我介绍","ja":"自己紹介","en":"Introductions"}},{"k":"lead","text":{"zh":"第一课：怎么打招呼、怎么问对方是谁、从哪来、住在哪、学什么。教材是 UGM INCULS 的《Titian Bahasa Pemula 1》，用的是\u003Cb>正式体\u003C/b>（saya / Anda），这是课堂和对老师说话的语体。点任意印尼语词或 ▶ 都能听发音。","ja":"第 1 課：あいさつの仕方、相手の名前・出身・住んでいるところ・専攻の尋ね方。教科書は UGM INCULS の『Titian Bahasa Pemula 1』で、\u003Cb>フォーマルな言い方\u003C/b>（saya / Anda）を使います。教室で、また先生に話すときの言い方です。インドネシア語の語や ▶ をタップすると発音が聞けます。","en":"Lesson one: how to greet someone, and how to ask who they are, where they are from, where they live and what they study. The book is UGM INCULS's «Titian Bahasa Pemula 1», and it uses the \u003Cb>formal\u003C/b> register (saya / Anda) — the one for the classroom and for speaking to a teacher. Tap any Indonesian word or ▶ to hear it."}},{"k":"note","green":true,"tag":{"zh":"本课目标","ja":"この課の目標","en":"What this chapter covers"},"lines":[{"text":{"zh":"\u003Cb>听\u003C/b>　听懂和自我介绍有关的简单词和短语。","ja":"\u003Cb>聞く\u003C/b>　自己紹介にかかわる簡単な語や句を聞き取る。","en":"\u003Cb>Listening\u003C/b>　Recognise simple words and phrases about personal information."}},{"text":{"zh":"\u003Cb>读\u003C/b>　读懂和自我介绍有关的短文。","ja":"\u003Cb>読む\u003C/b>　自己紹介にかかわる短い文章を読み取る。","en":"\u003Cb>Reading\u003C/b>　Understand short, simple texts about personal information."}},{"text":{"zh":"\u003Cb>词汇\u003C/b>　问候、初次见面、告别、称呼；疑问词 \u003Cs>apa\u003C/s>、\u003Cs>siapa\u003C/s>、\u003Cs>dari mana\u003C/s>、\u003Cs>di mana\u003C/s>、\u003Cs>apakah\u003C/s>。","ja":"\u003Cb>語彙\u003C/b>　あいさつ、初対面、別れ、呼びかけ。疑問詞 \u003Cs>apa\u003C/s>・\u003Cs>siapa\u003C/s>・\u003Cs>dari mana\u003C/s>・\u003Cs>di mana\u003C/s>・\u003Cs>apakah\u003C/s>。","en":"\u003Cb>Vocabulary\u003C/b>　Greetings, meeting, parting, and forms of address; the question words \u003Cs>apa\u003C/s>, \u003Cs>siapa\u003C/s>, \u003Cs>dari mana\u003C/s>, \u003Cs>di mana\u003C/s>, \u003Cs>apakah\u003C/s>."}},{"text":{"zh":"\u003Cb>语法\u003C/b>　第一、第二、第三人称代词：\u003Cs>saya\u003C/s>、\u003Cs>Anda\u003C/s>、\u003Cs>ia\u003C/s>／\u003Cs>dia\u003C/s>、\u003Cs>mereka\u003C/s>、\u003Cs>kami\u003C/s>、\u003Cs>kita\u003C/s>。","ja":"\u003Cb>文法\u003C/b>　一・二・三人称の代名詞：\u003Cs>saya\u003C/s>・\u003Cs>Anda\u003C/s>・\u003Cs>ia\u003C/s>／\u003Cs>dia\u003C/s>・\u003Cs>mereka\u003C/s>・\u003Cs>kami\u003C/s>・\u003Cs>kita\u003C/s>。","en":"\u003Cb>Grammar\u003C/b>　First, second and third person pronouns: \u003Cs>saya\u003C/s>, \u003Cs>Anda\u003C/s>, \u003Cs>ia\u003C/s>/\u003Cs>dia\u003C/s>, \u003Cs>mereka\u003C/s>, \u003Cs>kami\u003C/s>, \u003Cs>kita\u003C/s>."}},{"text":{"zh":"\u003Cb>说 · 写\u003C/b>　用简单句子介绍自己和别人（写 10–15 个词）。","ja":"\u003Cb>話す・書く\u003C/b>　簡単な文で自分と他の人を紹介する（書くのは 10〜15 語）。","en":"\u003Cb>Speaking & writing\u003C/b>　Describe yourself and someone else in simple sentences (10–15 words in writing)."}}]}],[{"k":"phead","title":"Menyimak","sub":{"zh":"听力","ja":"聞き取り","en":"Listening"}},{"k":"listen","file":"bab1-simakan1","dur":73,"title":{"zh":"Simakan 1 · 课本听力","ja":"Simakan 1 · 教科書の聞き取り","en":"Simakan 1 · textbook listening"},"note":{"zh":"边听边留意下面这些词有没有出现。第一遍不用全懂，抓住听得出来的就行；听两三遍再看下一页的对话。","ja":"下の語が出てくるかどうかに気をつけながら聞いてください。一度目は全部わからなくてかまいません。聞き取れたものだけで大丈夫です。二、三回聞いてから次のページの会話を見ましょう。","en":"Listen for the words below. You are not meant to catch everything the first time — take what you can. Play it two or three times before you look at the dialogue on the next page."}},{"k":"mini","text":{"zh":"听到了哪些词？· kata yang Anda dengar","ja":"どの語が聞こえましたか · kata yang Anda dengar","en":"Which words did you hear? · kata yang Anda dengar"}},{"k":"vocab","items":[{"w":"nama","reg":"neutral","gloss":{"zh":"名字","ja":"名前","en":"name"}},{"w":"saya","reg":"formal","gloss":{"zh":"我","ja":"わたし","en":"I, me"}},{"w":"tinggal","reg":"neutral","gloss":{"zh":"住","ja":"住む","en":"to live, to stay"}},{"w":"belajar","reg":"neutral","gloss":{"zh":"学习","ja":"学ぶ","en":"to study"}},{"w":"tahun","reg":"neutral","gloss":{"zh":"年 · 岁","ja":"年 · 歳","en":"year"}},{"w":"mahasiswa","reg":"neutral","gloss":{"zh":"大学生","ja":"大学生","en":"university student"}},{"w":"dari","reg":"neutral","gloss":{"zh":"从 · 来自","ja":"〜から","en":"from"}},{"w":"universitas","reg":"neutral","gloss":{"zh":"大学","ja":"大学","en":"university"}},{"w":"kota","reg":"neutral","gloss":{"zh":"城市","ja":"町 · 都市","en":"city, town"}},{"w":"dua puluh","reg":"neutral","gloss":{"zh":"二十","ja":"20","en":"twenty"}},{"w":"kenalkan","reg":"neutral","gloss":{"zh":"介绍一下","ja":"紹介します","en":"let me introduce"}},{"w":"geografi","reg":"neutral","gloss":{"zh":"地理学","ja":"地理学","en":"geography"}},{"w":"guru","reg":"neutral","gloss":{"zh":"老师（中小学）","ja":"先生（小中高）","en":"teacher (school)"}},{"w":"Sumatra","reg":"neutral","gloss":{"zh":"苏门答腊（岛）","ja":"スマトラ（島）","en":"Sumatra"}},{"w":"Medan","reg":"neutral","gloss":{"zh":"棉兰（苏门答腊城市）","ja":"メダン（スマトラの都市）","en":"Medan (city in Sumatra)"}},{"w":"Surabaya","reg":"neutral","gloss":{"zh":"泗水（东爪哇）","ja":"スラバヤ（東ジャワ）","en":"Surabaya (East Java)"}},{"w":"Bali","reg":"neutral","gloss":{"zh":"巴厘（岛）","ja":"バリ（島）","en":"Bali"}},{"w":"Kuta","reg":"neutral","gloss":{"zh":"库塔（巴厘的海滩区）","ja":"クタ（バリのビーチ）","en":"Kuta (beach area in Bali)"}}]}],[{"k":"phead","title":"Mahasiswa Baru","sub":{"zh":"新生 · 对话（上）","ja":"新入生 · 会話（前半）","en":"New students · dialogue (1)"}},{"k":"psub2","text":{"zh":"Ziah 是印尼学生，Sanggi 是韩国来的留学生。两人在 UGM 第一次见面。","ja":"Ziah はインドネシア人の学生、Sanggi は韓国から来た留学生です。二人は UGM ではじめて会います。","en":"Ziah is an Indonesian student; Sanggi is an exchange student from Korea. They meet for the first time at UGM."}},{"k":"dialog","rows":[{"who":"Ziah","id":"Selamat pagi.","reg":"formal","alt":null,"gloss":{"zh":"早上好。","ja":"おはようございます。","en":"Good morning."},"alt_gloss":null,"kw":["selamat","pagi"]},{"who":"Sanggi","id":"Selamat pagi.","reg":"formal","alt":null,"gloss":{"zh":"早上好。","ja":"おはようございます。","en":"Good morning."},"alt_gloss":null,"kw":["selamat","pagi"]},{"who":"Ziah","id":"Nama saya Ziah. Siapa nama Anda?","reg":"formal","alt":null,"gloss":{"zh":"我叫 Ziah。您叫什么名字？","ja":"わたしは Ziah です。お名前は何ですか。","en":"My name is Ziah. What is your name?"},"alt_gloss":null,"kw":["nama","siapa","anda"]},{"who":"Sanggi","id":"Nama saya Sanggi.","reg":"formal","alt":null,"gloss":{"zh":"我叫 Sanggi。","ja":"わたしは Sanggi です。","en":"My name is Sanggi."},"alt_gloss":null,"kw":["nama"]},{"who":"Ziah","id":"Anda dari mana, Mas Sanggi?","reg":"formal","alt":null,"gloss":{"zh":"Sanggi 兄，您从哪儿来？","ja":"Sanggi さん、どちらのご出身ですか。","en":"Where are you from, Mas Sanggi?"},"alt_gloss":null,"kw":["dari","mana","mas"]},{"who":"Sanggi","id":"Saya dari Korea. Apakah Anda orang Indonesia?","reg":"formal","alt":null,"gloss":{"zh":"我从韩国来。您是印尼人吗？","ja":"韓国から来ました。あなたはインドネシアの方ですか。","en":"I'm from Korea. Are you Indonesian?"},"alt_gloss":null,"kw":["dari","apakah","orang"]},{"who":"Ziah","id":"Ya, saya orang Indonesia. Apakah Anda mahasiswa UGM?","reg":"formal","alt":null,"gloss":{"zh":"是，我是印尼人。您是 UGM 的学生吗？","ja":"はい、わたしはインドネシア人です。UGM の学生ですか。","en":"Yes, I'm Indonesian. Are you a student at UGM?"},"alt_gloss":null,"kw":["orang","apakah","mahasiswa"]},{"who":"Sanggi","id":"Ya, saya mahasiswa UGM.","reg":"formal","alt":null,"gloss":{"zh":"是，我是 UGM 的学生。","ja":"はい、UGM の学生です。","en":"Yes, I'm a student at UGM."},"alt_gloss":null,"kw":["mahasiswa"]}]},{"k":"note","green":true,"tag":{"zh":"笔误修正","ja":"誤植の訂正","en":"Typo corrected"},"lines":[{"text":{"zh":"课本第 2 页 Sanggi 的第一句印成了 \u003Cs>Selamat pagi?\u003C/s>（带问号）。回应问候不是提问，这里按 \u003Cs>Selamat pagi.\u003C/s> 处理。App 里已经改成句号，读出来也是陈述语调。","ja":"教科書 2 ページの Sanggi の最初のせりふは \u003Cs>Selamat pagi?\u003C/s> と疑問符つきで印刷されています。あいさつへの返しは質問ではないので、ここでは \u003Cs>Selamat pagi.\u003C/s> としました。アプリでは句点に直してあり、読み上げも平叙のイントネーションです。","en":"On page 2 of the book, Sanggi's first line is printed as \u003Cs>Selamat pagi?\u003C/s> with a question mark. Returning a greeting is not a question, so it is treated here as \u003Cs>Selamat pagi.\u003C/s> The app uses a full stop, and the audio reads it as a statement."}}]}],[{"k":"phead","title":"Mahasiswa Baru","sub":{"zh":"新生 · 对话（下）","ja":"新入生 · 会話（後半）","en":"New students · dialogue (2)"}},{"k":"dialog","rows":[{"who":"Ziah","id":"Anda belajar apa?","reg":"formal","alt":null,"gloss":{"zh":"您学什么？","ja":"何を勉強していますか。","en":"What are you studying?"},"alt_gloss":null,"kw":["belajar","apa"]},{"who":"Sanggi","id":"Saya belajar bahasa Indonesia di INCULS.","reg":"formal","alt":null,"gloss":{"zh":"我在 INCULS 学印尼语。","ja":"INCULS でインドネシア語を勉強しています。","en":"I study Indonesian at INCULS."},"alt_gloss":null,"kw":["belajar","bahasa","di"]},{"who":"Ziah","id":"Di mana Anda tinggal?","reg":"formal","alt":null,"gloss":{"zh":"您住在哪儿？","ja":"どこに住んでいますか。","en":"Where do you live?"},"alt_gloss":null,"kw":["di","mana","tinggal"]},{"who":"Sanggi","id":"Saya tinggal di Jalan Kaliurang, Yogyakarta.","reg":"formal","alt":null,"gloss":{"zh":"我住在日惹的 Kaliurang 路。","ja":"ジョグジャカルタの Kaliurang 通りに住んでいます。","en":"I live on Jalan Kaliurang, Yogyakarta."},"alt_gloss":null,"kw":["tinggal","jalan"]},{"who":"Ziah","id":"Mas Sanggi, ini teman saya, Zach.","reg":"formal","alt":null,"gloss":{"zh":"Sanggi 兄，这是我朋友 Zach。","ja":"Sanggi さん、こちらはわたしの友だちの Zach です。","en":"Mas Sanggi, this is my friend Zach."},"alt_gloss":null,"kw":["ini","teman"]},{"who":"Sanggi","id":"Hai, Zach. Senang bertemu Anda.","reg":"formal","alt":null,"gloss":{"zh":"嗨，Zach。很高兴见到您。","ja":"こんにちは、Zach さん。お会いできてうれしいです。","en":"Hi, Zach. Nice to meet you."},"alt_gloss":null,"kw":["senang","bertemu"]},{"who":"Zach","id":"Hai, Sanggi. Senang bertemu Anda.","reg":"formal","alt":null,"gloss":{"zh":"嗨，Sanggi。很高兴见到您。","ja":"こんにちは、Sanggi さん。お会いできてうれしいです。","en":"Hi, Sanggi. Nice to meet you."},"alt_gloss":null,"kw":["senang","bertemu"]},{"who":"Sanggi","id":"Zach, apakah Anda dari Inggris?","reg":"formal","alt":null,"gloss":{"zh":"Zach，您是从英国来的吗？","ja":"Zach さんはイギリスから来たのですか。","en":"Zach, are you from England?"},"alt_gloss":null,"kw":["apakah","dari"]},{"who":"Zach","id":"Ya. Saya dari Inggris.","reg":"formal","alt":null,"gloss":{"zh":"是的。我从英国来。","ja":"はい。イギリスから来ました。","en":"Yes. I'm from England."},"alt_gloss":null,"kw":["dari"]},{"who":"Sanggi","id":"Maaf, saya akan masuk kelas. Sampai jumpa!","reg":"formal","alt":null,"gloss":{"zh":"不好意思，我要去上课了。回头见！","ja":"すみません、これから授業に入ります。またね。","en":"Sorry, I'm about to go to class. See you!"},"alt_gloss":null,"kw":["maaf","akan","masuk","kelas"]},{"who":"Zach","id":"Sampai jumpa!","reg":"formal","alt":null,"gloss":{"zh":"回头见！","ja":"またね。","en":"See you!"},"alt_gloss":null,"kw":["sampai","jumpa"]}]},{"k":"note","green":false,"tag":{"zh":"容易踩的坑","ja":"つまずきやすいところ","en":"Easy to get wrong"},"lines":[{"text":{"zh":"\u003Cs>Mas\u003C/s> 是对年纪相仿或稍长的男性的称呼（爪哇话，日惹到处在用），女性对应 \u003Cs>Mbak\u003C/s>。放在名字前面：Mas Sanggi、Mbak Ziah。比直接叫名字更礼貌，但又不像 \u003Cs>Bapak\u003C/s>／\u003Cs>Ibu\u003C/s> 那么正式。","ja":"\u003Cs>Mas\u003C/s> は同年代か少し年上の男性への呼びかけです（ジャワ語で、ジョグジャカルタでは日常的に使います）。女性には \u003Cs>Mbak\u003C/s>。名前の前に置いて Mas Sanggi、Mbak Ziah のように使います。名前を呼び捨てにするより丁寧で、\u003Cs>Bapak\u003C/s>／\u003Cs>Ibu\u003C/s> ほど硬くありません。","en":"\u003Cs>Mas\u003C/s> is how you address a man of about your own age or a little older (it is Javanese, and in Yogyakarta it is everywhere). For a woman it is \u003Cs>Mbak\u003C/s>. Put it before the name: Mas Sanggi, Mbak Ziah. It is warmer than using the bare name and less formal than \u003Cs>Bapak\u003C/s>/\u003Cs>Ibu\u003C/s>."}},{"text":{"zh":"\u003Cs>Senang bertemu Anda\u003C/s> 直译是「高兴见到您」。初次见面用它最稳。熟了以后口语会说 \u003Cs>Senang ketemu kamu\u003C/s>，但课堂上按课本说正式的那句。","ja":"\u003Cs>Senang bertemu Anda\u003C/s> は「お会いできてうれしいです」。初対面ではこれが無難です。親しくなると話しことばで \u003Cs>Senang ketemu kamu\u003C/s> と言いますが、教室では教科書どおりフォーマルな言い方にしましょう。","en":"\u003Cs>Senang bertemu Anda\u003C/s> is «pleased to meet you». It is the safe choice on a first meeting. Once you know someone, the spoken version is \u003Cs>Senang ketemu kamu\u003C/s> — but in class, stay with the formal one the book gives."}}]}],[{"k":"phead","title":"Kosakata","sub":{"zh":"问候 · 称呼 · 告别","ja":"あいさつ · 呼びかけ · 別れ","en":"Greetings, address, farewells"}},{"k":"sec","num":"①","word":"Salam","reg":"neutral","gloss":{"zh":"问候语","ja":"あいさつ","en":"greetings"}},{"k":"examples","items":[{"id":"Selamat pagi.","reg":"formal","alt":null,"gloss":{"zh":"早上好。（天亮到 11 点左右）","ja":"おはようございます。（夜明けから 11 時ごろまで）","en":"Good morning. (dawn until about 11)"},"alt_gloss":null,"kw":["pagi"]},{"id":"Selamat siang.","reg":"formal","alt":null,"gloss":{"zh":"中午好。（11 点到 3 点左右，太阳最高的时候）","ja":"こんにちは。（11 時から 3 時ごろ、日が高い時間）","en":"Good day. (about 11 to 3, when the sun is high)"},"alt_gloss":null,"kw":["siang"]},{"id":"Selamat sore.","reg":"formal","alt":null,"gloss":{"zh":"下午好。（3 点到天黑）","ja":"こんにちは。（3 時ごろから日が暮れるまで）","en":"Good afternoon. (about 3 until dark)"},"alt_gloss":null,"kw":["sore"]},{"id":"Selamat malam.","reg":"formal","alt":null,"gloss":{"zh":"晚上好。（天黑以后）","ja":"こんばんは。（日が暮れてから）","en":"Good evening. (after dark)"},"alt_gloss":null,"kw":["malam"]},{"id":"Halo!","reg":"neutral","alt":null,"gloss":{"zh":"你好！（随时都能用，比较随意）","ja":"やあ。（時間を選ばない、くだけた言い方）","en":"Hello! (any time of day, casual)"},"alt_gloss":null,"kw":["halo"]},{"id":"Apa kabar?","reg":"neutral","alt":null,"gloss":{"zh":"你好吗？","ja":"お元気ですか。","en":"How are you?"},"alt_gloss":null,"kw":["apa","kabar"]},{"id":"Baik.","reg":"neutral","alt":null,"gloss":{"zh":"挺好。（回答 Apa kabar? 的标准说法）","ja":"元気です。（Apa kabar? への定番の答え）","en":"Fine. (the standard answer to Apa kabar?)"},"alt_gloss":null,"kw":["baik"]}]},{"k":"note","green":false,"tag":{"zh":"容易踩的坑","ja":"つまずきやすいところ","en":"Easy to get wrong"},"lines":[{"text":{"zh":"四个 \u003Cs>Selamat …\u003C/s> 是按\u003Cb>一天中的时段\u003C/b>分的，不是按「见面／告别」分的。到了下午还说 Selamat pagi 会很奇怪。分界大致是：11 点、3 点、天黑。","ja":"四つの \u003Cs>Selamat …\u003C/s> は\u003Cb>一日の時間帯\u003C/b>で分かれています。「会うとき／別れるとき」の区別ではありません。午後に Selamat pagi と言うと不自然です。目安は 11 時、3 時、日暮れです。","en":"The four \u003Cs>Selamat …\u003C/s> greetings split the \u003Cb>day into parts\u003C/b>; they are not a meeting/parting distinction. Saying Selamat pagi in the afternoon sounds odd. The rough boundaries are 11am, 3pm and nightfall."}},{"text":{"zh":"\u003Cs>Selamat malam\u003C/s> 只是「晚上好」。睡前说的「晚安」是 \u003Cs>Selamat tidur\u003C/s>（tidur = 睡）。","ja":"\u003Cs>Selamat malam\u003C/s> は「こんばんは」だけです。寝る前の「おやすみ」は \u003Cs>Selamat tidur\u003C/s>（tidur ＝ 寝る）です。","en":"\u003Cs>Selamat malam\u003C/s> only means «good evening». «Good night», said before sleeping, is \u003Cs>Selamat tidur\u003C/s> (tidur = to sleep)."}}]},{"k":"rule"},{"k":"sec","num":"②","word":"Sapaan","reg":"neutral","gloss":{"zh":"称呼","ja":"呼びかけ","en":"forms of address"}},{"k":"vocab","items":[{"w":"Bapak","reg":"formal","gloss":{"zh":"先生（对年长男性，最正式）","ja":"〜さん（年上の男性へ、いちばん丁寧）","en":"Sir / Mr (older man, most formal)"}},{"w":"Pak","reg":"formal","gloss":{"zh":"Bapak 的短形式，日常最常用","ja":"Bapak の短い形。日常でいちばんよく使う","en":"short form of Bapak, the everyday one"}},{"w":"Ibu","reg":"formal","gloss":{"zh":"女士（对年长女性，最正式）","ja":"〜さん（年上の女性へ、いちばん丁寧）","en":"Madam / Mrs (older woman, most formal)"}},{"w":"Bu","reg":"formal","gloss":{"zh":"Ibu 的短形式","ja":"Ibu の短い形","en":"short form of Ibu"}},{"w":"Saudara","reg":"formal","gloss":{"zh":"阁下（正式、书面，对同辈）","ja":"〜氏（フォーマル・文語、同年代へ）","en":"you / sir (formal, written, to a peer)"}},{"w":"Mas","reg":"neutral","gloss":{"zh":"哥（对同辈或稍长男性，爪哇话）","ja":"〜さん（同年代か少し年上の男性、ジャワ語）","en":"elder brother (peer or slightly older man, Javanese)"}},{"w":"Mbak","reg":"neutral","gloss":{"zh":"姐（对同辈或稍长女性，爪哇话）","ja":"〜さん（同年代か少し年上の女性、ジャワ語）","en":"elder sister (peer or slightly older woman, Javanese)"}},{"w":"Dik","reg":"neutral","gloss":{"zh":"弟／妹（对比自己小的人）","ja":"〜くん・〜ちゃん（年下の人へ）","en":"younger sibling (to someone younger)"}}]},{"k":"note","green":true,"tag":{"zh":"在日惹怎么用","ja":"ジョグジャカルタでの使い分け","en":"How this works in Yogyakarta"},"lines":[{"text":{"zh":"对老师、店主、司机、比自己明显年长的人 → \u003Cs>Pak\u003C/s>／\u003Cs>Bu\u003C/s>。对同学、咖啡店店员、网约车司机（年纪相仿）→ \u003Cs>Mas\u003C/s>／\u003Cs>Mbak\u003C/s>。拿不准就用 Pak／Bu，往上抬一档不会失礼，往下才会。","ja":"先生・お店の人・運転手・明らかに年上の人には \u003Cs>Pak\u003C/s>／\u003Cs>Bu\u003C/s>。同級生・カフェの店員・同年代の配車ドライバーには \u003Cs>Mas\u003C/s>／\u003Cs>Mbak\u003C/s>。迷ったら Pak／Bu を使いましょう。一段上に見るのは失礼になりませんが、下に見ると失礼になります。","en":"For teachers, shopkeepers, drivers and anyone clearly older than you → \u003Cs>Pak\u003C/s>/\u003Cs>Bu\u003C/s>. For classmates, café staff and ride-hailing drivers of about your own age → \u003Cs>Mas\u003C/s>/\u003Cs>Mbak\u003C/s>. When in doubt use Pak/Bu: erring upwards is never rude, erring downwards can be."}}]},{"k":"rule"},{"k":"sec","num":"③","word":"Perpisahan","reg":"neutral","gloss":{"zh":"告别","ja":"別れのあいさつ","en":"parting"}},{"k":"examples","items":[{"id":"Sampai jumpa!","reg":"neutral","alt":null,"gloss":{"zh":"回头见！","ja":"またね。","en":"See you!"},"alt_gloss":null,"kw":["sampai","jumpa"]},{"id":"Sampai jumpa lagi!","reg":"neutral","alt":null,"gloss":{"zh":"再见！（下次再会）","ja":"また会いましょう。","en":"See you again!"},"alt_gloss":null,"kw":["lagi"]},{"id":"Sampai nanti!","reg":"neutral","alt":null,"gloss":{"zh":"待会儿见！（同一天之内）","ja":"また後で。（同じ日のうちに）","en":"See you later! (same day)"},"alt_gloss":null,"kw":["nanti"]},{"id":"Hati-hati di jalan!","reg":"neutral","alt":null,"gloss":{"zh":"路上小心！（送人走的时候说）","ja":"気をつけて。（見送るときに言う）","en":"Take care on the way! (said to someone leaving)"},"alt_gloss":null,"kw":["hati-hati","jalan"]},{"id":"Selamat datang.","reg":"formal","alt":null,"gloss":{"zh":"欢迎。","ja":"ようこそ。","en":"Welcome."},"alt_gloss":null,"kw":["datang"]},{"id":"Terima kasih.","reg":"formal","alt":null,"gloss":{"zh":"谢谢。","ja":"ありがとうございます。","en":"Thank you."},"alt_gloss":null,"kw":["terima","kasih"]},{"id":"Sama-sama.","reg":"neutral","alt":null,"gloss":{"zh":"不客气。","ja":"どういたしまして。","en":"You're welcome."},"alt_gloss":null,"kw":["sama-sama"]}]}],[{"k":"phead","title":"Kata Tanya","sub":{"zh":"疑问词","ja":"疑問詞","en":"Question words"}},{"k":"lead","text":{"zh":"这一课的五个疑问词。印尼语的疑问词可以放句首也可以放句尾，意思一样，句尾更口语一点。","ja":"この課で扱う疑問詞は五つ。インドネシア語の疑問詞は文頭にも文末にも置けます。意味は変わらず、文末のほうが少しくだけた感じになります。","en":"Five question words in this chapter. In Indonesian a question word can sit at the front or at the end of the sentence; the meaning is the same, and the end position sounds a little more conversational."}},{"k":"sec","num":"①","word":"Siapa","reg":"neutral","gloss":{"zh":"谁 · 什么（名字）","ja":"だれ · 何（名前）","en":"who · what (for names)"}},{"k":"examples","items":[{"id":"Siapa nama Anda?","reg":"formal","alt":null,"gloss":{"zh":"您叫什么名字？","ja":"お名前は何ですか。","en":"What is your name?"},"alt_gloss":null,"kw":["siapa","nama"]},{"id":"Itu siapa?","reg":"neutral","alt":null,"gloss":{"zh":"那是谁？","ja":"あの人はだれですか。","en":"Who is that?"},"alt_gloss":null,"kw":["itu","siapa"]},{"id":"Siapa itu?","reg":"neutral","alt":null,"gloss":{"zh":"那是谁？（同上，疑问词在前）","ja":"あれはだれですか。（同じ意味、疑問詞が前）","en":"Who is that? (same, question word first)"},"alt_gloss":null,"kw":["siapa","itu"]},{"id":"Itu Zach.","reg":"neutral","alt":null,"gloss":{"zh":"那是 Zach。","ja":"あれは Zach です。","en":"That's Zach."},"alt_gloss":null,"kw":["itu"]}]},{"k":"note","green":false,"tag":{"zh":"容易踩的坑","ja":"つまずきやすいところ","en":"Easy to get wrong"},"lines":[{"text":{"zh":"问名字用 \u003Cs>siapa\u003C/s>（谁），不用 \u003Cs>apa\u003C/s>（什么）。「Apa nama Anda?」在印尼语里是问「你这个东西叫什么」，用来问人会很怪。名字属于人，所以是 siapa。","ja":"名前を尋ねるときは \u003Cs>siapa\u003C/s>（だれ）を使い、\u003Cs>apa\u003C/s>（何）は使いません。「Apa nama Anda?」はモノの名前を尋ねる言い方で、人に対して使うと不自然です。名前は人に属するものなので siapa になります。","en":"Ask for a name with \u003Cs>siapa\u003C/s> (who), not \u003Cs>apa\u003C/s> (what). «Apa nama Anda?» asks what a thing is called and sounds strange applied to a person. A name belongs to a person, so it takes siapa."}}]},{"k":"rule"},{"k":"sec","num":"②","word":"Apa","reg":"neutral","gloss":{"zh":"什么","ja":"何","en":"what"}},{"k":"examples","items":[{"id":"Apa ini?","reg":"neutral","alt":null,"gloss":{"zh":"这是什么？","ja":"これは何ですか。","en":"What is this?"},"alt_gloss":null,"kw":["apa","ini"]},{"id":"Anda belajar apa?","reg":"formal","alt":null,"gloss":{"zh":"您学什么？","ja":"何を勉強していますか。","en":"What are you studying?"},"alt_gloss":null,"kw":["belajar","apa"]},{"id":"Saya belajar bahasa Indonesia.","reg":"formal","alt":null,"gloss":{"zh":"我学印尼语。","ja":"インドネシア語を勉強しています。","en":"I study Indonesian."},"alt_gloss":null,"kw":["belajar","bahasa"]}]},{"k":"rule"},{"k":"sec","num":"③","word":"Dari mana","reg":"neutral","gloss":{"zh":"从哪里（来）","ja":"どこから","en":"where from"}},{"k":"examples","items":[{"id":"Anda dari mana?","reg":"formal","alt":null,"gloss":{"zh":"您从哪儿来？","ja":"どちらのご出身ですか。","en":"Where are you from?"},"alt_gloss":null,"kw":["dari","mana"]},{"id":"Dari mana Sanggi?","reg":"neutral","alt":null,"gloss":{"zh":"Sanggi 从哪儿来？","ja":"Sanggi さんはどこから来ましたか。","en":"Where is Sanggi from?"},"alt_gloss":null,"kw":["dari","mana"]},{"id":"Sanggi dari Korea.","reg":"neutral","alt":null,"gloss":{"zh":"Sanggi 从韩国来。","ja":"Sanggi さんは韓国から来ました。","en":"Sanggi is from Korea."},"alt_gloss":null,"kw":["dari"]}]},{"k":"rule"},{"k":"sec","num":"④","word":"Di mana","reg":"neutral","gloss":{"zh":"在哪里","ja":"どこに","en":"where"}},{"k":"examples","items":[{"id":"Anda tinggal di mana?","reg":"formal","alt":null,"gloss":{"zh":"您住在哪儿？","ja":"どこに住んでいますか。","en":"Where do you live?"},"alt_gloss":null,"kw":["tinggal","di","mana"]},{"id":"Di mana Anda tinggal?","reg":"formal","alt":null,"gloss":{"zh":"您住在哪儿？（同上，疑问词在前）","ja":"どこに住んでいますか。（同じ意味、疑問詞が前）","en":"Where do you live? (same, question word first)"},"alt_gloss":null,"kw":["di","mana","tinggal"]},{"id":"Saya tinggal di Jalan Kaliurang.","reg":"formal","alt":null,"gloss":{"zh":"我住在 Kaliurang 路。","ja":"Kaliurang 通りに住んでいます。","en":"I live on Jalan Kaliurang."},"alt_gloss":null,"kw":["tinggal","di"]}]},{"k":"note","green":false,"tag":{"zh":"容易踩的坑","ja":"つまずきやすいところ","en":"Easy to get wrong"},"lines":[{"text":{"zh":"\u003Cs>di\u003C/s> 表示\u003Cb>在哪里\u003C/b>（位置），\u003Cs>dari\u003C/s> 表示\u003Cb>从哪里\u003C/b>（来源），\u003Cs>ke\u003C/s> 表示\u003Cb>去哪里\u003C/b>（方向）。三个只差一个词，问的却是完全不同的事：Saya tinggal \u003Cb>di\u003C/b> Jogja（我住在日惹）／ Saya \u003Cb>dari\u003C/b> Cina（我从中国来）／ Saya pergi \u003Cb>ke\u003C/b> pasar（我去市场）。","ja":"\u003Cs>di\u003C/s> は\u003Cb>どこに\u003C/b>（位置）、\u003Cs>dari\u003C/s> は\u003Cb>どこから\u003C/b>（出どころ）、\u003Cs>ke\u003C/s> は\u003Cb>どこへ\u003C/b>（方向）です。一語違うだけで尋ねている内容がまったく変わります。Saya tinggal \u003Cb>di\u003C/b> Jogja（ジョグジャに住んでいます）／ Saya \u003Cb>dari\u003C/b> Cina（中国から来ました）／ Saya pergi \u003Cb>ke\u003C/b> pasar（市場へ行きます）。","en":"\u003Cs>di\u003C/s> marks \u003Cb>where something is\u003C/b>, \u003Cs>dari\u003C/s> marks \u003Cb>where it comes from\u003C/b>, and \u003Cs>ke\u003C/s> marks \u003Cb>where it is going\u003C/b>. One small word apart, three quite different questions: Saya tinggal \u003Cb>di\u003C/b> Jogja (I live in Jogja) / Saya \u003Cb>dari\u003C/b> Cina (I'm from China) / Saya pergi \u003Cb>ke\u003C/b> pasar (I'm going to the market)."}}]},{"k":"rule"},{"k":"sec","num":"⑤","word":"Apakah","reg":"formal","gloss":{"zh":"是不是 · 吗（是非问句）","ja":"〜ですか（はい／いいえで答える質問）","en":"yes/no question marker"}},{"k":"examples","items":[{"id":"Apakah Ziah mahasiswa?","reg":"formal","alt":null,"gloss":{"zh":"Ziah 是大学生吗？","ja":"Ziah さんは大学生ですか。","en":"Is Ziah a student?"},"alt_gloss":null,"kw":["apakah","mahasiswa"]},{"id":"Ya. Ziah mahasiswa.","reg":"neutral","alt":null,"gloss":{"zh":"是。Ziah 是大学生。","ja":"はい。Ziah さんは大学生です。","en":"Yes. Ziah is a student."},"alt_gloss":null,"kw":["ya"]},{"id":"Apakah Anda orang Indonesia?","reg":"formal","alt":null,"gloss":{"zh":"您是印尼人吗？","ja":"インドネシアの方ですか。","en":"Are you Indonesian?"},"alt_gloss":null,"kw":["apakah","orang"]},{"id":"Bukan. Saya orang Cina.","reg":"formal","alt":null,"gloss":{"zh":"不是。我是中国人。","ja":"いいえ。わたしは中国人です。","en":"No. I'm Chinese."},"alt_gloss":null,"kw":["bukan","orang"]}]},{"k":"note","green":false,"tag":{"zh":"容易踩的坑","ja":"つまずきやすいところ","en":"Easy to get wrong"},"lines":[{"text":{"zh":"否定「不是」用 \u003Cs>bukan\u003C/s>（否定名词），不是 \u003Cs>tidak\u003C/s>。\u003Cs>tidak\u003C/s> 否定的是动词和形容词：Saya \u003Cb>bukan\u003C/b> guru（我不是老师）／ Saya \u003Cb>tidak\u003C/b> tahu（我不知道）。这一条这一课还没讲，但只要回答 Apakah… 的问句就会立刻用到。","ja":"「〜ではない」と名詞を否定するときは \u003Cs>bukan\u003C/s> を使い、\u003Cs>tidak\u003C/s> は使いません。\u003Cs>tidak\u003C/s> が否定するのは動詞と形容詞です。Saya \u003Cb>bukan\u003C/b> guru（わたしは先生ではありません）／ Saya \u003Cb>tidak\u003C/b> tahu（知りません）。この課ではまだ説明されていませんが、Apakah… の質問に答えるとすぐ必要になります。","en":"To say «is not» about a noun, use \u003Cs>bukan\u003C/s>, not \u003Cs>tidak\u003C/s>. \u003Cs>tidak\u003C/s> negates verbs and adjectives: Saya \u003Cb>bukan\u003C/b> guru (I'm not a teacher) / Saya \u003Cb>tidak\u003C/b> tahu (I don't know). The book hasn't covered this yet, but you need it the moment you answer an Apakah… question."}},{"text":{"zh":"\u003Cs>apakah\u003C/s> 是正式体。口语里直接把陈述句读成升调就是问句了：\u003Cs>Anda orang Indonesia?\u003C/s> 课堂上和写作业按课本用 apakah。","ja":"\u003Cs>apakah\u003C/s> はフォーマルな言い方です。話しことばでは平叙文を上げ調子で言うだけで質問になります：\u003Cs>Anda orang Indonesia?\u003C/s> 教室や課題では教科書どおり apakah を使いましょう。","en":"\u003Cs>apakah\u003C/s> belongs to the formal register. In speech, a statement said with rising intonation is already a question: \u003Cs>Anda orang Indonesia?\u003C/s> In class and in written work, use apakah as the book does."}}]}],[{"k":"phead","title":"Tata Bahasa","sub":{"zh":"语法 · 人称代词","ja":"文法 · 人称代名詞","en":"Grammar · pronouns"}},{"k":"table","cols":[{"zh":"人称","ja":"人称","en":"Person"},{"zh":"单数","ja":"単数","en":"Singular"},{"zh":"复数","ja":"複数","en":"Plural"}],"rows":[[{"text":{"zh":"第一人称（我／我们）","ja":"一人称（わたし／わたしたち）","en":"First (I / we)"}},{"id":"saya","reg":"formal"},{"id":"kami","reg":"formal"}],["",{"id":"aku","reg":"casual"},{"id":"kita","reg":"formal"}],[{"text":{"zh":"第二人称（你／你们）","ja":"二人称（あなた／あなたがた）","en":"Second (you)"}},{"id":"Anda","reg":"formal"},{"id":"kalian","reg":"formal"}],["",{"id":"kamu","reg":"casual"},{"id":"Saudara sekalian","reg":"formal"}],[{"text":{"zh":"第三人称（他／她／他们）","ja":"三人称（かれ・かのじょ／かれら）","en":"Third (he / she / they)"}},{"id":"dia","reg":"formal"},{"id":"mereka","reg":"formal"}],["",{"id":"ia","reg":"formal"},{"id":"mereka semua","reg":"formal"}]],"note":{"zh":"教材还列了 \u003Cb>beliau\u003C/b>（第三人称的敬语，用于长辈、老师、地位高的人）和 \u003Cb>Saudara\u003C/b>（书面正式的「您」）。课本没给 beliau 标语体，其实它比 dia 更敬。","ja":"教科書には \u003Cb>beliau\u003C/b>（三人称の敬語。目上の人・先生・地位のある人に使う）と \u003Cb>Saudara\u003C/b>（文語的でフォーマルな「あなた」）も挙がっています。教科書は beliau に語体の印をつけていませんが、実際には dia より敬意の高い語です。","en":"The book also lists \u003Cb>beliau\u003C/b> (a respectful third person, for elders, teachers and people of standing) and \u003Cb>Saudara\u003C/b> (a formal, written «you»). The book leaves beliau unmarked, though it is in fact more deferential than dia."}},{"k":"note","green":false,"tag":{"zh":"课本没讲，但一定会踩","ja":"教科書にはないが必ずつまずくところ","en":"Not in the book, but you will hit it"},"lines":[{"text":{"zh":"\u003Cb>kami 和 kita 都是「我们」，但不能互换。\u003C/b>\u003Cs>kami\u003C/s> \u003Cb>不包括\u003C/b>听话的人，\u003Cs>kita\u003C/s> \u003Cb>包括\u003C/b>听话的人。对老师说「我们（学生）是 UGM 的学生」用 kami；对同学说「我们一起去吧」用 kita。说反了意思就变了 —— 这是印尼语最经典的一个坑，中文和英文都没有这个区分。","ja":"\u003Cb>kami と kita はどちらも「わたしたち」ですが、入れ替えられません。\u003C/b>\u003Cs>kami\u003C/s> は聞き手を\u003Cb>含みません\u003C/b>。\u003Cs>kita\u003C/s> は聞き手を\u003Cb>含みます\u003C/b>。先生に「わたしたち（学生）は UGM の学生です」と言うときは kami、友だちに「いっしょに行こう」と言うときは kita です。取り違えると意味が変わります。日本語にはこの区別がないので、いちばんつまずきやすいところです。","en":"\u003Cb>kami and kita both mean «we», and they are not interchangeable.\u003C/b> \u003Cs>kami\u003C/s> \u003Cb>excludes\u003C/b> the person you are talking to; \u003Cs>kita\u003C/s> \u003Cb>includes\u003C/b> them. Telling a teacher «we (students) are at UGM» takes kami; telling a friend «let's go» takes kita. Get it the wrong way round and the meaning changes. English has no such distinction, which is why this one catches everyone."}},{"text":{"zh":"\u003Cs>Anda\u003C/s> \u003Cb>永远大写\u003C/b>，句子中间也一样。这是印尼语的正字法规定，不是排版风格。","ja":"\u003Cs>Anda\u003C/s> は\u003Cb>つねに大文字で書きます\u003C/b>。文の途中でも同じです。これはインドネシア語の正書法の決まりで、体裁の問題ではありません。","en":"\u003Cs>Anda\u003C/s> is \u003Cb>always capitalised\u003C/b>, mid-sentence included. That is Indonesian orthography, not a typesetting choice."}},{"text":{"zh":"\u003Cs>ia\u003C/s> 和 \u003Cs>dia\u003C/s> 都是「他／她」，印尼语的第三人称\u003Cb>不分性别\u003C/b>。\u003Cs>ia\u003C/s> 偏书面，\u003Cs>dia\u003C/s> 口笔都能用，日常说 dia 就行。","ja":"\u003Cs>ia\u003C/s> も \u003Cs>dia\u003C/s> も「かれ・かのじょ」で、インドネシア語の三人称は\u003Cb>性別を区別しません\u003C/b>。\u003Cs>ia\u003C/s> は文語寄り、\u003Cs>dia\u003C/s> は話しことばでも書きことばでも使えます。ふだんは dia で問題ありません。","en":"\u003Cs>ia\u003C/s> and \u003Cs>dia\u003C/s> both mean «he» or «she» — Indonesian third person \u003Cb>does not mark gender\u003C/b>. \u003Cs>ia\u003C/s> leans literary; \u003Cs>dia\u003C/s> works in speech and writing alike, and is what you will say day to day."}}]}],[{"k":"phead","title":"Berbicara","sub":{"zh":"说 · 介绍自己","ja":"話す · 自己紹介","en":"Speaking · introduce yourself"}},{"k":"psub2","text":{"zh":"课本的范文。照这个骨架换成自己的信息，就是一段完整的自我介绍。","ja":"教科書の例文です。この型に自分の情報を入れれば、そのまま自己紹介になります。","en":"The model text from the book. Swap in your own details and this is a complete self-introduction."}},{"k":"examples","title":{"zh":"① 介绍自己 · memperkenalkan diri","ja":"① 自分を紹介する · memperkenalkan diri","en":"① Introducing yourself · memperkenalkan diri"},"items":[{"id":"Selamat pagi. Nama saya Akira.","reg":"formal","alt":null,"gloss":{"zh":"早上好。我叫 Akira。","ja":"おはようございます。わたしは Akira です。","en":"Good morning. My name is Akira."},"alt_gloss":null,"kw":["nama"]},{"id":"Saya dari Kota Kobe, Jepang.","reg":"formal","alt":null,"gloss":{"zh":"我从日本神户市来。","ja":"日本の神戸市から来ました。","en":"I'm from the city of Kobe, Japan."},"alt_gloss":null,"kw":["dari","kota"]},{"id":"Saya belajar bahasa Indonesia di UGM.","reg":"formal","alt":null,"gloss":{"zh":"我在 UGM 学印尼语。","ja":"UGM でインドネシア語を勉強しています。","en":"I study Indonesian at UGM."},"alt_gloss":null,"kw":["belajar","di"]},{"id":"Saya datang ke Yogyakarta dua minggu lalu.","reg":"formal","alt":null,"gloss":{"zh":"我两周前来到日惹。","ja":"二週間前にジョグジャカルタに来ました。","en":"I came to Yogyakarta two weeks ago."},"alt_gloss":null,"kw":["datang","ke","minggu"]},{"id":"Saya sekarang tinggal di Jalan Kaliurang Nomor 8, Yogyakarta.","reg":"formal","alt":null,"gloss":{"zh":"我现在住在日惹 Kaliurang 路 8 号。","ja":"いまはジョグジャカルタの Kaliurang 通り 8 番地に住んでいます。","en":"I now live at 8 Jalan Kaliurang, Yogyakarta."},"alt_gloss":null,"kw":["sekarang","tinggal","nomor"]},{"id":"Saya suka makan nasi goreng dan minum teh.","reg":"formal","alt":null,"gloss":{"zh":"我喜欢吃炒饭、喝茶。","ja":"ナシゴレンを食べるのと、お茶を飲むのが好きです。","en":"I like eating nasi goreng and drinking tea."},"alt_gloss":null,"kw":["suka","makan","minum"]},{"id":"Saya suka berenang dan menonton film.","reg":"formal","alt":null,"gloss":{"zh":"我喜欢游泳和看电影。","ja":"泳ぐことと映画を見ることが好きです。","en":"I like swimming and watching films."},"alt_gloss":null,"kw":["suka","berenang","menonton"]},{"id":"Saya senang tinggal di Indonesia. Terima kasih.","reg":"formal","alt":null,"gloss":{"zh":"我很喜欢住在印尼。谢谢。","ja":"インドネシアでの暮らしが気に入っています。ありがとうございました。","en":"I'm happy living in Indonesia. Thank you."},"alt_gloss":null,"kw":["senang","tinggal"]}]},{"k":"rule"},{"k":"examples","title":{"zh":"② 介绍别人 · memperkenalkan teman","ja":"② 友だちを紹介する · memperkenalkan teman","en":"② Introducing someone else · memperkenalkan teman"},"items":[{"id":"Selamat pagi. Ini Rama. Dia teman saya.","reg":"formal","alt":null,"gloss":{"zh":"早上好。这是 Rama。他是我朋友。","ja":"おはようございます。こちらは Rama です。わたしの友だちです。","en":"Good morning. This is Rama. He's my friend."},"alt_gloss":null,"kw":["ini","dia","teman"]},{"id":"Dia orang Indonesia. Dia mahasiswa.","reg":"formal","alt":null,"gloss":{"zh":"他是印尼人。他是大学生。","ja":"かれはインドネシア人です。大学生です。","en":"He's Indonesian. He's a student."},"alt_gloss":null,"kw":["dia","orang","mahasiswa"]},{"id":"Dia belajar ekonomi di UGM.","reg":"formal","alt":null,"gloss":{"zh":"他在 UGM 学经济学。","ja":"UGM で経済学を勉強しています。","en":"He studies economics at UGM."},"alt_gloss":null,"kw":["belajar","ekonomi"]},{"id":"Dia tinggal di Jalan Magelang Nomor 15 A, Yogyakarta.","reg":"formal","alt":null,"gloss":{"zh":"他住在日惹 Magelang 路 15A 号。","ja":"ジョグジャカルタの Magelang 通り 15A に住んでいます。","en":"He lives at 15A Jalan Magelang, Yogyakarta."},"alt_gloss":null,"kw":["tinggal","di"]},{"id":"Dia suka makan bakso dan jalan-jalan. Terima kasih.","reg":"formal","alt":null,"gloss":{"zh":"他喜欢吃肉丸汤，喜欢到处逛。谢谢。","ja":"かれはバッソを食べることと、出かけることが好きです。ありがとうございました。","en":"He likes eating bakso and going out. Thank you."},"alt_gloss":null,"kw":["suka","makan","jalan-jalan"]}]},{"k":"note","green":true,"tag":{"zh":"换成自己的","ja":"自分の情報に置きかえる","en":"Make it yours"},"lines":[{"text":{"zh":"介绍自己用 \u003Cs>saya\u003C/s>，介绍别人用 \u003Cs>dia\u003C/s>，其余句型一模一样。把 Akira／Kobe／两周／炒饭换成你自己的答案，念熟到不用想 —— 开学第一天全班都要站起来说一遍。","ja":"自分を紹介するときは \u003Cs>saya\u003C/s>、人を紹介するときは \u003Cs>dia\u003C/s>。ほかの文型はまったく同じです。Akira・神戸・二週間・ナシゴレンのところを自分の答えに入れかえて、考えずに言えるまで声に出しておきましょう。初日にクラス全員が立って一度は言うことになります。","en":"Use \u003Cs>saya\u003C/s> for yourself and \u003Cs>dia\u003C/s> for someone else; every other pattern is identical. Swap Akira, Kobe, two weeks and nasi goreng for your own answers and say it until you no longer have to think — on the first day everyone stands up and does this."}}]}],[{"k":"phead","title":"Menulis","sub":{"zh":"写 · 身份信息","ja":"書く · 身分事項","en":"Writing · identity details"}},{"k":"psub2","text":{"zh":"印尼身份证（KTP）上的栏目。填表、办手机卡、租房、注册都会遇到这些词。","ja":"インドネシアの身分証（KTP）の項目です。書類の記入、SIM カードの契約、部屋探し、登録手続きで必ず出てきます。","en":"The fields on an Indonesian ID card (KTP). You will meet these words on forms, when getting a SIM card, renting a room and registering for anything."}},{"k":"vocab","items":[{"w":"Nama","reg":"neutral","gloss":{"zh":"姓名","ja":"氏名","en":"Name"}},{"w":"Tempat/Tanggal Lahir","reg":"neutral","gloss":{"zh":"出生地／出生日期","ja":"出生地／生年月日","en":"Place / date of birth"}},{"w":"Jenis Kelamin","reg":"neutral","gloss":{"zh":"性别","ja":"性別","en":"Sex"}},{"w":"Golongan darah","reg":"neutral","gloss":{"zh":"血型","ja":"血液型","en":"Blood type"}},{"w":"Alamat","reg":"neutral","gloss":{"zh":"地址","ja":"住所","en":"Address"}},{"w":"Agama","reg":"neutral","gloss":{"zh":"宗教","ja":"宗教","en":"Religion"}},{"w":"Status Perkawinan","reg":"neutral","gloss":{"zh":"婚姻状况","ja":"婚姻の有無","en":"Marital status"}},{"w":"Pekerjaan","reg":"neutral","gloss":{"zh":"职业","ja":"職業","en":"Occupation"}},{"w":"Kewarganegaraan","reg":"neutral","gloss":{"zh":"国籍","ja":"国籍","en":"Nationality"}}]},{"k":"examples","title":{"zh":"照身份证写一段介绍 · contoh","ja":"身分証をもとに紹介文を書く · contoh","en":"An introduction written from an ID card · contoh"},"items":[{"id":"Nama saya Slamet Sujoko.","reg":"formal","alt":null,"gloss":{"zh":"我叫 Slamet Sujoko。","ja":"わたしは Slamet Sujoko です。","en":"My name is Slamet Sujoko."},"alt_gloss":null,"kw":["nama"]},{"id":"Saya dari Kudus, Jawa Tengah.","reg":"formal","alt":null,"gloss":{"zh":"我从中爪哇的库杜斯来。","ja":"中部ジャワのクドゥスから来ました。","en":"I'm from Kudus, Central Java."},"alt_gloss":null,"kw":["dari"]},{"id":"Saya lahir di Kudus, 17 Mei 1978.","reg":"formal","alt":null,"gloss":{"zh":"我 1978 年 5 月 17 日生于库杜斯。","ja":"1978 年 5 月 17 日にクドゥスで生まれました。","en":"I was born in Kudus on 17 May 1978."},"alt_gloss":null,"kw":["lahir","di"]},{"id":"Saya karyawan swasta.","reg":"formal","alt":null,"gloss":{"zh":"我是私企职员。","ja":"民間企業の会社員です。","en":"I'm a private-sector employee."},"alt_gloss":null,"kw":["karyawan"]},{"id":"Saya tinggal di Wergu Wetan, Kudus.","reg":"formal","alt":null,"gloss":{"zh":"我住在库杜斯的 Wergu Wetan。","ja":"クドゥスの Wergu Wetan に住んでいます。","en":"I live in Wergu Wetan, Kudus."},"alt_gloss":null,"kw":["tinggal","di"]},{"id":"Agama saya Islam.","reg":"formal","alt":null,"gloss":{"zh":"我信伊斯兰教。","ja":"宗教はイスラム教です。","en":"My religion is Islam."},"alt_gloss":null,"kw":["agama"]},{"id":"Golongan darah saya B.","reg":"formal","alt":null,"gloss":{"zh":"我是 B 型血。","ja":"血液型は B 型です。","en":"My blood type is B."},"alt_gloss":null,"kw":["golongan","darah"]},{"id":"Saya warga Indonesia.","reg":"formal","alt":null,"gloss":{"zh":"我是印尼公民。","ja":"インドネシア国民です。","en":"I'm an Indonesian citizen."},"alt_gloss":null,"kw":["warga"]}]},{"k":"note","green":true,"tag":{"zh":"笔误修正","ja":"誤植の訂正","en":"Typo corrected"},"lines":[{"text":{"zh":"课本第 9 页范文写的是「Saya tinggal di \u003Cs>Wegu\u003C/s> Wetan」，但同一页身份证图上印的是 \u003Cb>WERGU WETAN\u003C/b>。地名是 Wergu Wetan（库杜斯的一个区），App 里已按正确拼写。","ja":"教科書 9 ページの例文は「Saya tinggal di \u003Cs>Wegu\u003C/s> Wetan」となっていますが、同じページの身分証の画像には \u003Cb>WERGU WETAN\u003C/b> と印刷されています。地名は Wergu Wetan（クドゥスの一地区）です。アプリでは正しいつづりに直してあります。","en":"On page 9 the model text reads «Saya tinggal di \u003Cs>Wegu\u003C/s> Wetan», but the ID card pictured on the same page shows \u003Cb>WERGU WETAN\u003C/b>. The place is Wergu Wetan, a district of Kudus; the app uses the correct spelling."}}]}],[{"k":"phead","title":"Wawasan Keindonesiaan","sub":{"zh":"印尼常识 · 名字与问候","ja":"インドネシア豆知識 · 名前とあいさつ","en":"About Indonesia · names and greetings"}},{"k":"psub2","text":{"zh":"印尼名字常常能看出一个人来自哪个族群、信什么教。知道这一点，第一次见面就能少猜几次。","ja":"インドネシアの名前からは、その人がどの民族の出身か、どの宗教を信じているかが見えてくることがよくあります。これを知っておくと、初対面で当てずっぽうをしなくてすみます。","en":"An Indonesian name often tells you which ethnic group someone comes from and which religion they follow. Knowing this saves a good deal of guessing at a first meeting."}},{"k":"table","cols":[{"zh":"族群 · 地区","ja":"民族 · 地域","en":"Group · region"},{"zh":"常见名字","ja":"よくある名前","en":"Typical names"}],"rows":[[{"text":{"zh":"巴厘 \u003Cs>Bali\u003C/s>","ja":"バリ \u003Cs>Bali\u003C/s>","en":"\u003Cs>Bali\u003C/s>"}},{"text":{"zh":"\u003Cs>Wayan\u003C/s> · \u003Cs>Nyoman\u003C/s> · \u003Cs>Made\u003C/s> · \u003Cs>Ni\u003C/s>","ja":"\u003Cs>Wayan\u003C/s> · \u003Cs>Nyoman\u003C/s> · \u003Cs>Made\u003C/s> · \u003Cs>Ni\u003C/s>","en":"\u003Cs>Wayan\u003C/s> · \u003Cs>Nyoman\u003C/s> · \u003Cs>Made\u003C/s> · \u003Cs>Ni\u003C/s>"}}],[{"text":{"zh":"爪哇 \u003Cs>Jawa\u003C/s>","ja":"ジャワ \u003Cs>Jawa\u003C/s>","en":"Java"}},{"text":{"zh":"\u003Cs>Slamet\u003C/s> · \u003Cs>Pujo\u003C/s> · \u003Cs>Suharto\u003C/s> · \u003Cs>Sri\u003C/s> · \u003Cs>Endang\u003C/s> · \u003Cs>Joko\u003C/s>","ja":"\u003Cs>Slamet\u003C/s> · \u003Cs>Pujo\u003C/s> · \u003Cs>Suharto\u003C/s> · \u003Cs>Sri\u003C/s> · \u003Cs>Endang\u003C/s> · \u003Cs>Joko\u003C/s>","en":"\u003Cs>Slamet\u003C/s> · \u003Cs>Pujo\u003C/s> · \u003Cs>Suharto\u003C/s> · \u003Cs>Sri\u003C/s> · \u003Cs>Endang\u003C/s> · \u003Cs>Joko\u003C/s>"}}],[{"text":{"zh":"巽他 \u003Cs>Sunda\u003C/s>（西爪哇）","ja":"スンダ \u003Cs>Sunda\u003C/s>（西ジャワ）","en":"\u003Cs>Sunda\u003C/s> (West Java)"}},{"text":{"zh":"\u003Cs>Asep\u003C/s> · \u003Cs>Ujang\u003C/s> · \u003Cs>Elis\u003C/s> · \u003Cs>Iin\u003C/s>","ja":"\u003Cs>Asep\u003C/s> · \u003Cs>Ujang\u003C/s> · \u003Cs>Elis\u003C/s> · \u003Cs>Iin\u003C/s>","en":"\u003Cs>Asep\u003C/s> · \u003Cs>Ujang\u003C/s> · \u003Cs>Elis\u003C/s> · \u003Cs>Iin\u003C/s>"}}],[{"text":{"zh":"巴塔克 \u003Cs>Batak\u003C/s>（北苏门答腊）","ja":"バタック \u003Cs>Batak\u003C/s>（北スマトラ）","en":"\u003Cs>Batak\u003C/s> (North Sumatra)"}},{"text":{"zh":"\u003Cs>Togar\u003C/s> · \u003Cs>Luhut\u003C/s> · \u003Cs>Duma\u003C/s> · \u003Cs>Tiar\u003C/s>","ja":"\u003Cs>Togar\u003C/s> · \u003Cs>Luhut\u003C/s> · \u003Cs>Duma\u003C/s> · \u003Cs>Tiar\u003C/s>","en":"\u003Cs>Togar\u003C/s> · \u003Cs>Luhut\u003C/s> · \u003Cs>Duma\u003C/s> · \u003Cs>Tiar\u003C/s>"}}],[{"text":{"zh":"带宗教色彩的名字","ja":"宗教に由来する名前","en":"Religious names"}},{"text":{"zh":"\u003Cs>Siti\u003C/s> · \u003Cs>Ahmad\u003C/s>（伊斯兰）· \u003Cs>Josep\u003C/s> · \u003Cs>Markus\u003C/s>（基督教）","ja":"\u003Cs>Siti\u003C/s> · \u003Cs>Ahmad\u003C/s>（イスラム）· \u003Cs>Josep\u003C/s> · \u003Cs>Markus\u003C/s>（キリスト教）","en":"\u003Cs>Siti\u003C/s> · \u003Cs>Ahmad\u003C/s> (Islamic) · \u003Cs>Josep\u003C/s> · \u003Cs>Markus\u003C/s> (Christian)"}}]],"note":{"zh":"词尾能看出性别：\u003Cb>-man\u003C/b>、\u003Cb>-wan\u003C/b> 多是男名（Hermawan、Suparman），\u003Cb>-wati\u003C/b> 多是女名（Hermawati、Ratnawati）。","ja":"語尾から性別が見えることがあります。\u003Cb>-man\u003C/b>・\u003Cb>-wan\u003C/b> は男性名に多く（Hermawan、Suparman）、\u003Cb>-wati\u003C/b> は女性名に多い（Hermawati、Ratnawati）です。","en":"The ending often marks gender: \u003Cb>-man\u003C/b> and \u003Cb>-wan\u003C/b> tend to be men's names (Hermawan, Suparman), \u003Cb>-wati\u003C/b> women's (Hermawati, Ratnawati)."}},{"k":"mini","text":{"zh":"各宗教的问候语 · ungkapan salam","ja":"宗教ごとのあいさつ · ungkapan salam","en":"Greetings by religion · ungkapan salam"}},{"k":"table","cols":[{"zh":"问候语","ja":"あいさつ","en":"Greeting"},{"zh":"属于哪个宗教","ja":"どの宗教のもの","en":"Which religion"}],"rows":[[{"id":"Assalamualaikum","reg":"neutral"},{"text":{"zh":"伊斯兰教","ja":"イスラム教","en":"Islam"}}],[{"id":"Salam sejahtera","reg":"neutral"},{"text":{"zh":"通用（正式场合、官方讲话常用）","ja":"共通（式典や公式のあいさつでよく使う）","en":"General (common in formal and official speech)"}}],[{"id":"Shalom","reg":"neutral"},{"text":{"zh":"基督教","ja":"キリスト教","en":"Christianity"}}],[{"id":"Om Swastiastu","reg":"neutral"},{"text":{"zh":"印度教（巴厘）","ja":"ヒンドゥー教（バリ）","en":"Hinduism (Bali)"}}],[{"id":"Namo Buddhaya","reg":"neutral"},{"text":{"zh":"佛教","ja":"仏教","en":"Buddhism"}}],[{"id":"Salam Kebajikan","reg":"neutral"},{"text":{"zh":"孔教","ja":"儒教","en":"Confucianism"}}]],"note":{"zh":"官方讲话常常把这几句\u003Cb>连着念一遍\u003C/b>，表示照顾到所有宗教。你自己用的话，跟着对方说、或者用中性的 \u003Cb>Selamat pagi\u003C/b> 最稳妥。","ja":"公式のあいさつでは、これらを\u003Cb>続けて全部読み上げる\u003C/b>ことがよくあります。すべての宗教に配慮するためです。自分で使うときは相手に合わせるか、中立的な \u003Cb>Selamat pagi\u003C/b> にしておくのが無難です。","en":"In official speeches these are often \u003Cb>read out one after another\u003C/b>, so that every religion is addressed. For your own use, follow whatever the other person says, or stay with the neutral \u003Cb>Selamat pagi\u003C/b>."}},{"k":"reviewbtn"}]]}],"vocab":[{"w":"selamat","les":1,"reg":"neutral","pair":null,"gloss":{"zh":"平安 · 祝（用在问候语开头）","ja":"無事な · おめでとう（あいさつの頭に置く）","en":"safe, well (opens a greeting)"},"pos":"adj","ex":"Selamat pagi.","ex_reg":"formal","ex_gloss":{"zh":"早上好。","ja":"おはようございます。","en":"Good morning."},"note":null},{"w":"pagi","les":1,"reg":"neutral","pair":null,"gloss":{"zh":"早上（天亮到 11 点）","ja":"朝（夜明けから 11 時ごろ）","en":"morning (dawn to about 11)"},"pos":"n","ex":"Selamat pagi.","ex_reg":"formal","ex_gloss":{"zh":"早上好。","ja":"おはようございます。","en":"Good morning."},"note":null},{"w":"siang","les":1,"reg":"neutral","pair":null,"gloss":{"zh":"中午（11 点到 3 点）","ja":"昼（11 時から 3 時ごろ）","en":"midday (about 11 to 3)"},"pos":"n","ex":"Selamat siang.","ex_reg":"formal","ex_gloss":{"zh":"中午好。","ja":"こんにちは。","en":"Good day."},"note":null},{"w":"sore","les":1,"reg":"neutral","pai /* ===== 语言 =====
   LANG 的确定顺序：localStorage 里存的选择 → 浏览器语言 → meta 的默认值。
   L(x)  把 {zh, ja, en} 解析成当前语言的字符串（缺则 zh → en → ja 兜底）。
   T(k)  取界面文案，键见 content/i18n/ui.*.json，支持 {0} {1} 占位。
   印尼语字段是纯字符串，L() 原样返回。 */
var LANGS = CONTENT.meta.langs;

function detectLang(){
  /* ① 用户上次的选择 */
  try{
    var saved = localStorage.getItem("lang");
    if(saved && LANGS.indexOf(saved) >= 0) return saved;
  }catch(e){}
  /* ② 浏览器语言。zh-CN / zh-Hans / ja-JP / en-GB 都要认得出 */
  if(CONTENT.meta.detect_browser_lang){
    var cands = [];
    if(navigator.languages && navigator.languages.length) cands = cands.concat(navigator.languages);
    if(navigator.language) cands.push(navigator.language);
    for(var i = 0; i < cands.length; i++){
      var tag = String(cands[i]).toLowerCase();
      var base = tag.split("-")[0];
      if(LANGS.indexOf(base) >= 0) return base;
    }
  }
  /* ③ 兜底 */
  return CONTENT.meta.default_lang || LANGS[0];
}

var LANG = detectLang();

function L(x){
  if(x == null) return "";
  if(typeof x === "string") return x;
  var v = x[LANG];
  if(v != null && v !== "") return v;
  if(x.zh != null && x.zh !== "") return x.zh;
  if(x.en != null && x.en !== "") return x.en;
  if(x.ja != null && x.ja !== "") return x.ja;
  return "";
}
/* 词条 / 释义的「副释义」：非英文界面下补一条英文，英文界面下不重复。 */
function L2(x){
  if(x == null || typeof x === "string") return "";
  if(LANG === "en") return "";
  return x.en || "";
}

/* 界面文案。T("gloss.sub", 42) → "学过的词 · 共 42 个" */
function T(key){
  var args = Array.prototype.slice.call(arguments, 1);
  var node = CONTENT.ui[LANG];
  var parts = key.split(".");
  for(var i = 0; i < parts.length && node != null; i++) node = node[parts[i]];
  if(node == null){
    /* 缺键时退回默认语言，再退回键名本身 —— 界面不能因为漏一条就空白 */
    node = CONTENT.ui[CONTENT.meta.default_lang];
    for(var j = 0; j < parts.length && node != null; j++) node = node[parts[j]];
  }
  if(node == null) return key;
  if(typeof node !== "string") return node;
  return node.replace(/\{(\d)\}/g, function(m, n){
    return args[+n] != null ? String(args[+n]) : m;
  });
}

var JAM_WORDS = ["","satu","dua","tiga","empat","lima","enam",
                 "tujuh","delapan","sembilan","sepuluh","sebelas","dua belas"];
function jamRead(h, half){
  /* half=true 表示 X:30 —— 印尼语说「到下一点的一半」 */
  if(half){
    var nxt = (h % 12) + 1;
    return "setengah " + JAM_WORDS[nxt];
  }
  return "jam " + JAM_WORDS[h];
}
function jamDigits(h, half){
  return h + ":" + (half ? "30" : "00");
}

/* 数字:分档随机,覆盖日常价格与数量 */
function numRead(n){
  function under100(x){
    if(x === 0) return "kosong";
    if(x < 12) return ["kosong","satu","dua","tiga","empat","lima","enam","tujuh","delapan","sembilan","sepuluh","sebelas"][x];
    if(x < 20) return under100(x % 10) + " belas";
    var t = Math.floor(x / 10), r = x % 10;
    return under100(t) + " puluh" + (r ? " " + under100(r) : "");
  }
  function under1000(x){
    if(x < 100) return under100(x);
    var h = Math.floor(x / 100), r = x % 100;
    return (h === 1 ? "seratus" : under100(h) + " ratus") + (r ? " " + under100(r) : "");
  }
  if(n < 1000) return under1000(n);
  if(n < 1000000){
    var k = Math.floor(n / 1000), r = n % 1000;
    return (k === 1 ? "seribu" : under1000(k) + " ribu") + (r ? " " + under1000(r) : "");
  }
  var j = Math.floor(n / 1000000), r2 = n % 1000000;
  return (j === 1 ? "sejuta" : under1000(j) + " juta") + (r2 ? " " + under1000(Math.floor(r2/1000)) + " ribu" : "");
}
function fmtRp(n){
  var s = String(n), out = "", c = 0;
  for(var i = s.length - 1; i >= 0; i--){
    out = s.charAt(i) + out;
    if(++c % 3 === 0 && i > 0) out = "." + out;
  }
  return out;
}

var toArr = function(x){ return Array.prototype.slice.call(x); };
var esc = function(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); };
var clean = function(s){ return s.replace(/[?!.,:;"'’“”()／/]+/g," ").replace(/\s+/g," ").trim(); };
/* 整句/词条朗读:保留 ? ! . , —— 问号决定升调,剥掉会被读成陈述句。
   只去掉引号、括号、斜杠这些不该念出来的符号。
   注意:句内单词的逐词点读仍用 clean(),单个词不该带问号。 */
var sayText = function(s){
  return s.replace(/[\u201c\u201d\u2018\u2019"']/g, "")
          .replace(/[()（）／/]+/g, " ")
          .replace(/\s+/g, " ").trim();
};

/* 点读图标。用内联 SVG，不用 emoji / ▶ 之类的字形 ——

var PLAY_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
